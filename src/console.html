                    Clear
                  </button>
                </div>
                {showEmpty &&
                  empty.map((c) => (
                    <ChannelCard key={c.channel} c={c} onPick={onPick} active={false} />
                  ))}
              </div>
            )}
          </div>
        );
      }

      // Quality presets for the WebRTC stream. Persisted per browser. The relay
      // reconfigures the encoder live on change, so a higher preset costs
      // bandwidth only while somebody is actually watching at it.
      const QUALITY_PRESETS = {
        low:      { label: "Low · 8fps 960px",       fps: 8,  maxWidth: 960,  bitrate: 400000 },
        balanced: { label: "Balanced · 12fps 1280px", fps: 12, maxWidth: 1280, bitrate: 800000 },
        high:     { label: "High · 24fps 1600px",     fps: 24, maxWidth: 1600, bitrate: 2000000 },
        ultra:    { label: "Ultra · 30fps 1920px",    fps: 30, maxWidth: 1920, bitrate: 4000000 },
      };
      function loadQualityKey() { try { return localStorage.getItem("ttf-preview-quality") || "balanced"; } catch { return "balanced"; } }
      function saveQualityKey(key) { try { localStorage.setItem("ttf-preview-quality", key); } catch {} }
      function qualityOf(key) {
        const preset = QUALITY_PRESETS[key] || QUALITY_PRESETS.balanced;
        return { fps: preset.fps, maxWidth: preset.maxWidth, bitrate: preset.bitrate };
      }

      // Browser key -> agent key name. The agent enforces this same allowlist
      // again server-side; this map is UX, not the security boundary.
      const CONTROL_KEYS = { "\\": "backslash", Escape: "escape", ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };

      // Drive the Figma viewport from the preview. The preview is a screenshot
      // of the Figma app window, so the only way to move it is to move the real
      // viewport in the plugin: every gesture posts to /navigator/viewport and
      // the next capture (~2s) shows the result. Gestures are coalesced into a
      // single in-flight request, so a fast drag or a burst of clicks can never
      // queue up dozens of round trips.
      const VP_ZOOM_STEP = 1.25;
      const VP_PAN_STEP = 0.25;    // a quarter of a screen per arrow press
      const VP_POLL_MS = 5000;     // keeps the readout honest when Figma is driven by hand

      function useViewportControl(projectKey) {
        const [viewport, setViewport] = useState(null);
        const [error, setError] = useState(null);
        const inflight = useRef(false);
        const pending = useRef(null);
        const flushRef = useRef(null);

        const read = useCallback(async () => {
          if (!projectKey || inflight.current || pending.current) return;
          try {
            const r = await fetch(relayApiUrl("navigator/viewport") + `?project=${encodeURIComponent(projectKey)}`);
            const data = await r.json();
            if (!r.ok) { setError(data.error || `HTTP ${r.status}`); return; }
            setError(null); setViewport(data.result);
          } catch (e) { setError(String(e)); }
        }, [projectKey]);

        const flush = useCallback(async () => {
          if (inflight.current || !pending.current || !projectKey) return;
          const body = pending.current;
          pending.current = null;
          inflight.current = true;
          try {
            const r = await fetch(relayApiUrl("navigator/viewport"), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ project: projectKey, ...body }),
            });
            const data = await r.json();
            if (!r.ok) setError(data.error || `HTTP ${r.status}`);
            // Render what Figma actually did — it clamps the zoom and snaps
            // the center, so an optimistic guess would drift out of sync.
            else { setError(null); setViewport(data.result); }
          } catch (e) { setError(String(e)); }
          finally {
            inflight.current = false;
            if (pending.current && flushRef.current) flushRef.current();
          }
        }, [projectKey]);
        flushRef.current = flush;

        // Deltas merge with a pending delta; an absolute move replaces it.
        const nudge = useCallback((delta) => {
          const base = pending.current && (pending.current.panByFraction || pending.current.zoomBy)
            ? pending.current
            : { panByFraction: { x: 0, y: 0 }, zoomBy: 1 };
          if (delta.panByFraction) {
            base.panByFraction.x += delta.panByFraction.x;
            base.panByFraction.y += delta.panByFraction.y;
          }
          if (delta.zoomBy) base.zoomBy *= delta.zoomBy;
          pending.current = base;
          flush();
        }, [flush]);

        const jump = useCallback((body) => { pending.current = body; flush(); }, [flush]);

        useEffect(() => {
          setViewport(null); setError(null); pending.current = null;
          if (!projectKey) return;
          read();
          const timer = setInterval(read, VP_POLL_MS);
          return () => clearInterval(timer);
        }, [projectKey, read]);

        return { viewport, error, nudge, jump };
      }

      function PreviewPanel({ project, preview, rtc, onClose, onInput, qualityKey, onQualityChange }) {
        const { viewport, error: vpError, nudge, jump } = useViewportControl(project ? project.projectKey : null);
        const stageRef = useRef(null);
        const videoRef = useRef(null);
        const drag = useRef(null);
        // Control mode: clicks and allowlisted keys go into the real window.
        // Off by default — the preview is view-only until somebody opts in,
        // and it needs the live stream (the agent is also the input path).
        const [control, setControl] = useState(false);
        const live = rtc && rtc.status === "live";

        useEffect(() => {
          const video = videoRef.current;
          if (video && rtc && rtc.stream && video.srcObject !== rtc.stream) {
            video.srcObject = rtc.stream;
            video.play().catch(() => {});
          }
        }, [rtc && rtc.stream, live]);
        useEffect(() => { if (!live && control) setControl(false); }, [live]);

        // Wheel must be a non-passive native listener: React's synthetic wheel
        // handler is passive, so preventDefault there would not stop the page
        // from scrolling under the gesture.
        useEffect(() => {
          const el = stageRef.current;
          if (!el) return;
          const onWheel = (e) => {
            e.preventDefault();
            nudge({ zoomBy: Math.exp(-e.deltaY * 0.0015) });
          };
          el.addEventListener("wheel", onWheel, { passive: false });
          return () => el.removeEventListener("wheel", onWheel);
        }, [nudge]);

        if (!project) return null;

        // The stream is the whole window, letterboxed by object-fit: contain —
        // so a click maps to normalized window coordinates via the video's
        // content box. Normalized is all the agent accepts: a point outside
        // the window cannot even be expressed.
        const normalizedPoint = (e) => {
          const video = videoRef.current;
          if (!video || !video.videoWidth) return null;
          const rect = video.getBoundingClientRect();
          const scale = Math.min(rect.width / video.videoWidth, rect.height / video.videoHeight);
          const contentW = video.videoWidth * scale, contentH = video.videoHeight * scale;
          const offsetX = rect.left + (rect.width - contentW) / 2;
          const offsetY = rect.top + (rect.height - contentH) / 2;
          const x = (e.clientX - offsetX) / contentW;
          const y = (e.clientY - offsetY) / contentH;
          if (x < 0 || x > 1 || y < 0 || y > 1) return null;
          return { x, y };
        };

        // Drag pans the Figma viewport (as before); in control mode a press
        // that never travels more than a few pixels is a click into the window.
        const onPointerDown = (e) => {
          if (e.button !== 0 || (!preview?.url && !live)) return;
          const rect = e.currentTarget.getBoundingClientRect();
          drag.current = { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, moved: 0, w: rect.width || 1, h: rect.height || 1 };
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
        };
        const onPointerMove = (e) => {
          const d = drag.current;
          if (!d) return;
          const dx = e.clientX - d.x, dy = e.clientY - d.y;
          if (!dx && !dy) return;
          d.moved = Math.max(d.moved, Math.hypot(e.clientX - d.startX, e.clientY - d.startY));
          d.x = e.clientX; d.y = e.clientY;
          nudge({ panByFraction: { x: -dx / d.w, y: -dy / d.h } });
        };
        const endDrag = (e) => {
          const d = drag.current;
          drag.current = null;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
          if (control && live && d && d.moved < 4) {
            const point = normalizedPoint(e);
            if (point && onInput) onInput({ type: "click", x: point.x, y: point.y, clickCount: Math.min(3, e.detail || 1) });
          }
        };
        const onContextMenu = (e) => {
          if (!control || !live) return;
          e.preventDefault();
          const point = normalizedPoint(e);
          if (point && onInput) onInput({ type: "click", x: point.x, y: point.y, clickCount: 1, button: "right" });
        };
        const onKeyDown = (e) => {
          if (!control || !live) return;
          const key = CONTROL_KEYS[e.key === "₩" ? "\\" : e.key];   // Korean layout: same physical key reports won-sign
          if (!key) return;
          e.preventDefault();
          if (onInput) onInput({ type: "key", key, modifiers: e.shiftKey ? ["shift"] : [] });
        };
        const sendKey = (key, modifiers) => { if (onInput) onInput({ type: "key", key, modifiers: modifiers || [] }); };

        const modeBadge = live ? "LIVE · WebRTC"
          : rtc && rtc.status === "connecting" ? "connecting…"
          : rtc && rtc.status === "fallback" ? "JPEG fallback"
          : "Figma app window";

        return (
          <div className="preview-panel">
            <div className="preview-head">
              <strong>Live Figma preview · {project.name || "(untitled)"}</strong>
              <span className={"badge" + (live ? " live-badge" : "")}>{modeBadge}</span>
              {onClose && <button className="ghost" onClick={onClose}>Close preview</button>}
            </div>
            <div className="preview-controls">
              <button className="ghost" title="Pan left (drag the preview, or scroll to zoom)" onClick={() => nudge({ panByFraction: { x: -VP_PAN_STEP, y: 0 } })}>←</button>
              <button className="ghost" title="Pan right" onClick={() => nudge({ panByFraction: { x: VP_PAN_STEP, y: 0 } })}>→</button>
              <button className="ghost" title="Pan up" onClick={() => nudge({ panByFraction: { x: 0, y: -VP_PAN_STEP } })}>↑</button>
              <button className="ghost" title="Pan down" onClick={() => nudge({ panByFraction: { x: 0, y: VP_PAN_STEP } })}>↓</button>
              <span className="vp-sep" />
              <button className="ghost" title="Zoom out" onClick={() => nudge({ zoomBy: 1 / VP_ZOOM_STEP })}>−</button>
              <button className="ghost" title="Zoom in" onClick={() => nudge({ zoomBy: VP_ZOOM_STEP })}>＋</button>
              <code className="muted" title="Figma zoom level">{viewport ? `${Math.round(viewport.zoom * 100)}%` : "…"}</code>
              <span className="vp-sep" />
              <button className="ghost" title="Zoom to fit this page" onClick={() => jump({ fit: "page" })}>Fit page</button>
              <button className="ghost" title="Zoom to fit the current Figma selection" onClick={() => jump({ fit: "selection" })}>Fit selection</button>
              <span className="vp-sep" />
              <select
                className="quality-select"
                title="Stream quality (frame rate / resolution / bitrate) — applies live"
                value={qualityKey}
                onChange={(e) => onQualityChange && onQualityChange(e.target.value)}
              >
                {Object.entries(QUALITY_PRESETS).map(([key, preset]) => <option key={key} value={key}>{preset.label}</option>)}
              </select>
              <button
                className={"ghost" + (control ? " control-on" : "")}
                disabled={!live}
                title={live ? "Send clicks and view keys into the real Figma window" : "Control needs the live WebRTC stream"}
                onClick={() => setControl((value) => !value)}
              >
                {control ? "🎮 Control ON" : "Control"}
              </button>
              {control && live && (
                <>
                  <button className="ghost" title="Toggle Figma's UI (backslash / ₩)" onClick={() => sendKey("backslash")}>\ UI</button>
                  <button className="ghost" title="Escape" onClick={() => sendKey("escape")}>Esc</button>
                  <button className="ghost" title="Zoom to fit (Shift+1)" onClick={() => sendKey("one", ["shift"])}>⇧1</button>
                  <button className="ghost" title="Zoom to 100% (Shift+0)" onClick={() => sendKey("zero", ["shift"])}>⇧0</button>
                </>
              )}
              {vpError && <code className="bad" title={vpError}>⚠ {vpError}</code>}
            </div>
            <div
              className={"preview-stage" + (preview?.url || live ? " grab" : "") + (control && live ? " control" : "")}
              ref={stageRef}
              tabIndex={0}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={endDrag}
              onPointerCancel={endDrag}
              onContextMenu={onContextMenu}
              onKeyDown={onKeyDown}
            >
              <video
                ref={videoRef}
                style={{ display: live ? "block" : "none" }}
                autoPlay
                muted
                playsInline
                draggable={false}
              />
              {!live && (preview?.url
                ? <img src={preview.url} alt={`Live preview of ${project.name || "Figma project"}`} draggable={false} />
                : <span className={preview?.error ? "bad" : "muted"}>
                    {preview?.error || (rtc && rtc.status === "connecting" ? "Negotiating the live stream…" : "Waiting for the Figma plugin…")}
                  </span>)}
            </div>
            {(preview?.meta || live) && (
              <div className="preview-meta">
                {live
                  ? `WebRTC · H.264 · ${(QUALITY_PRESETS[qualityKey] || QUALITY_PRESETS.balanced).label}`
                  : `${preview.meta.pageName || "Current page"} · ${preview.meta.nodeName || "frame"} · ${preview.meta.source || "preview"} · ${preview.meta.width || "?"}×${preview.meta.height || "?"} · ${Math.round((preview.meta.byteLength || 0) / 1024)} KB`}
                {viewport ? ` · viewport ${Math.round(viewport.center.x)}, ${Math.round(viewport.center.y)} @ ${Math.round(viewport.zoom * 100)}%` : ""}
                {control && live ? " · control: click = real click, right-click, \\ / Esc / arrows" : ""}
              </div>
            )}
          </div>
        );
      }

      function Projects({ projects, bulkJobs, onProjectPick, onFilterPick }) {
        return (
          <>
            <div className="section">
              <h2>Figma Projects</h2>
              {!projects.length && <div className="muted">No connected Figma projects.</div>}
              {projects.map((project) => (
                <div className="chan-card" key={project.projectKey} onClick={() => onProjectPick(project)}>
                  <div className="chan-head">
                    <span className="doc-name">{project.name || "(untitled)"}</span>
                    <span className="badge">{project.connectionCount} connected</span>
                  </div>
                  <div className="member">
                    <code>{project.busy ? "working" : "idle"} · {project.runningRequests || 0} running · {project.pendingRequests || 0} pending · recommended #{project.recommendedChannel || "—"}</code>
                  </div>
                  {project.connections.map((connection) => {
                    const plugin = connection.clients.find((c) => c.role === "figma");
                    const pv = plugin && plugin.protocolVersion;
                    return (
                      <div className="member" key={connection.channel}>
                        <span className="badge figma">#{connection.channel}</span>
                        <code>{connection.runningRequests || 0} running · {connection.pendingRequests || 0} pending · {connection.clients.filter((c) => c.role === "controller").length} MCP clients</code>
                        {pv && (
                          <code style={versionMismatch(pv) ? { color: "#ff6b6b", fontWeight: 700 } : { opacity: 0.7 }}>
                            v{pv}{versionMismatch(pv) ? " ⚠" : ""}
                          </code>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
            <div className="section">
              <h2>Bulk Operations</h2>
              {!bulkJobs.length && <div className="muted">No bulk operations.</div>}
              {[...bulkJobs].sort((a, b) => b.updatedAt - a.updatedAt).map((job) => (
                <div className="chan-card" key={job.id} onClick={() => onFilterPick(job.id)}>
                  <div className="chan-head">
                    <code>{job.id.slice(0, 8)}</code>
                    <span className="badge">{job.status}</span>
                  </div>
                  <div className="member"><code>{job.completed || 0}/{job.total || 0} complete · {job.failed || 0} failed</code></div>
                  <div className="member"><code>{job.requesterId || "unknown requester"}</code></div>
                </div>
              ))}
            </div>
          </>
        );
      }

      // ----- Search index panel ---------------------------------------------
      function fmtAge(ts) {
        if (!ts) return "never";
        const s = Math.round((Date.now() - ts) / 1000);
        if (s < 90) return `${s}s ago`;
        if (s < 5400) return `${Math.round(s / 60)}m ago`;
        if (s < 129600) return `${Math.round(s / 3600)}h ago`;
        return `${Math.round(s / 86400)}d ago`;
      }

      // Query-first index panel: clicking a project card opens a read-only
      // DETAIL view (per-page builtAt/nodeCount/partial/dirty). Rebuilds only
      // run from explicit small buttons behind a confirm dialog; per-page
      // reindex (light) runs without confirm via POST /index/rebuild-page.
      function IndexPanel({ projects }) {
        const [status, setStatus] = useState(null);
        const [cacheStatus, setCacheStatus] = useState({}); // projectKey -> result|{error}
        const [busy, setBusy] = useState(false);
        const [detailKey, setDetailKey] = useState(null);   // expanded project
        const [detail, setDetail] = useState(null);         // /index/project result
        const [pageBusy, setPageBusy] = useState({});       // pageId -> bool
        const [pageMsg, setPageMsg] = useState({});         // pageId -> string

        const refresh = useCallback(async () => {
          try {
            const r = await fetch(relayApiUrl("index/status"));
            setStatus(await r.json());
          } catch (e) { setStatus({ error: String(e) }); }
        }, []);

        useEffect(() => {
          refresh();
          const t = setInterval(refresh, 5000);
          return () => clearInterval(t);
        }, [refresh]);

        const loadDetail = useCallback(async (projectKey) => {
          setDetail({ loading: true });
          try {
            const r = await fetch(relayApiUrl("index/project") + `?project=${encodeURIComponent(projectKey)}`);
            const data = await r.json();
            setDetail(r.ok ? data : { error: data.error || `HTTP ${r.status}` });
          } catch (e) { setDetail({ error: String(e) }); }
        }, []);

        const toggleDetail = (projectKey) => {
          if (detailKey === projectKey) { setDetailKey(null); setDetail(null); return; }
          setDetailKey(projectKey);
          setPageMsg({});
          loadDetail(projectKey);
        };

        const rebuild = async (projectKey, name) => {
          const q = projectKey
            ? `Rebuild the FULL index for "${name || projectKey}"? Every page is rescanned — this can take a while.`
            : "Rebuild the FULL index for ALL live projects? Every page of every project is rescanned — this can take a while.";
          if (!window.confirm(q)) return;
          setBusy(true);
          try {
            await fetch(relayApiUrl("index/rebuild") + (projectKey ? `?project=${encodeURIComponent(projectKey)}` : ""), { method: "POST" });
            await refresh();
          } finally { setBusy(false); }
        };

        const reindexPage = async (pageId) => {
          if (!detailKey) return;
          setPageBusy((s) => ({ ...s, [pageId]: true }));
          setPageMsg((s) => ({ ...s, [pageId]: null }));
          try {
            const r = await fetch(relayApiUrl("index/rebuild-page"), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ project: detailKey, pageId }),
            });
            const data = await r.json();
            if (r.status === 202) setPageMsg((s) => ({ ...s, [pageId]: "queued — another refresh is busy; picked up within 5 min" }));
            else if (!r.ok) setPageMsg((s) => ({ ...s, [pageId]: "⚠ " + (data.error || `HTTP ${r.status}`) }));
            await loadDetail(detailKey);
            await refresh();
          } catch (e) {
            setPageMsg((s) => ({ ...s, [pageId]: "⚠ " + String(e) }));
          } finally {
            setPageBusy((s) => ({ ...s, [pageId]: false }));
          }
        };

        const fetchCache = async (projectKey) => {
          try {
            const r = await fetch(relayApiUrl("index/cache-status") + `?project=${encodeURIComponent(projectKey)}`);
            setCacheStatus((s) => ({ ...s, [projectKey]: null }));
            const data = await r.json();
            setCacheStatus((s) => ({ ...s, [projectKey]: data }));
          } catch (e) {
            setCacheStatus((s) => ({ ...s, [projectKey]: { error: String(e) } }));
          }
        };

        const running = status && status.state === "running";
        const disk = (status && status.diskIndexes) || [];
        const jobByKey = {};
        ((status && status.jobProjects) || []).forEach((p) => { jobByKey[p.projectKey] = p; });
        // Show every project we know about: live ones + ones with a disk index.
        const keys = new Map();
        projects.forEach((p) => keys.set(p.projectKey, { name: p.name, live: true }));
        disk.forEach((d) => { if (!keys.has(d.projectKey)) keys.set(d.projectKey, { name: d.projectName || d.projectKey, live: false }); });
        const diskByKey = {};
        disk.forEach((d) => { diskByKey[d.projectKey] = d; });

        const smallBtn = { padding: "2px 8px", fontSize: 11 };
        return (
          <div className="section">
            <h2>Search Index</h2>
            {!status && <div className="muted">Loading…</div>}
            {status && status.error && <div className="muted">{status.error}</div>}
            {status && !status.error && (
              <div className="chan-card" style={{ cursor: "default" }}>
                <div className="chan-head">
                  <span className="doc-name">{running ? "Indexing…" : "Idle"}</span>
                  <span className="badge">{running ? `${status.scannedPages}/${status.totalPages} pages` : `built ${fmtAge(status.lastCompletedAt)}`}</span>
                </div>
                {running && status.currentStep && (
                  <div className="member"><code>now: {status.currentStep.pageName} · avg {status.avgPageMs ? (status.avgPageMs / 1000).toFixed(1) : "?"}s/page · ETA {status.etaMs ? Math.round(status.etaMs / 1000) + "s" : "?"}</code></div>
                )}
                {status.lastError && <div className="member"><code>⚠ {status.lastError}</code></div>}
                {status.dirty && (status.dirty.pendingPages > 0 || status.dirty.lastRunAt) && (
                  <div className="member">
                    <code>
                      dirty: {status.dirty.pendingPages} page(s) queued
                      {status.dirty.running ? " · refreshing…" : ""}
                      {status.dirty.lastRunAt ? ` · last incremental ${fmtAge(status.dirty.lastRunAt)} (${status.dirty.lastUpdatedPages} page(s))` : ""}
                    </code>
                  </div>
                )}
                <div className="member">
                  <button className="ghost" disabled={busy || running} onClick={() => rebuild()} style={smallBtn}>
                    Rebuild all…
                  </button>
                  <span className="muted" style={{ fontSize: 11 }}>full rescan of every live project (asks first)</span>
                </div>
              </div>
            )}
            {[...keys.entries()].map(([projectKey, info]) => {
              const d = diskByKey[projectKey];
              const j = jobByKey[projectKey];
              const cache = cacheStatus[projectKey];
              const open = detailKey === projectKey;
              return (
                <div className="chan-card" key={projectKey} style={{ cursor: "default" }}>
                  <div className="chan-head" style={{ cursor: "pointer" }} onClick={() => toggleDetail(projectKey)} title="Click for per-page detail">
                    <span className="doc-name"><span className="caret">{open ? "▾" : "▸"}</span>{info.name || "(untitled)"}</span>
                    <span className="badge">{d ? `${d.pageCount} pages · ${d.nodeCount} nodes` : "no index"}</span>
                  </div>
                  <div className="member"><code>built {fmtAge(d && d.builtAt)}{d && d.updatedAt && d.updatedAt !== d.builtAt ? ` · updated ${fmtAge(d.updatedAt)}` : ""}{j && running ? ` · scanning ${j.scannedPages}/${j.totalPages}` : ""}{j && j.failures && j.failures.length ? ` · ${j.failures.length} failed pages` : ""}{j && j.partial && j.partial.length ? ` · ${j.partial.length} partial pages` : ""}</code></div>

                  {open && detail && detail.loading && <div className="member muted">Loading detail…</div>}
                  {open && detail && detail.error && <div className="member"><code>⚠ {detail.error}</code></div>}
                  {open && detail && detail.pages && (
                    <div style={{ marginTop: 6 }}>
                      {detail.pages.map((p) => (
                        <div key={p.pageId}>
                          <div className="idx-page-row">
                            <span className="grow" title={p.pageId}>
                              {p.dirty ? "◔ " : "● "}{p.pageName || p.pageId}
                            </span>
                            <span className="muted">{p.nodeCount} nodes · {fmtAge(p.builtAt)}</span>
                            {p.partial && <span className="badge" title={p.partial.error || "some nodes were skipped"}>partial · {p.partial.skippedNodes} skipped</span>}
                            {p.dirty && <span className="badge" title="changed since last index; queued for the incremental cycle">dirty</span>}
                            <button
                              className="ghost" style={smallBtn}
                              disabled={!!pageBusy[p.pageId] || running || !info.live}
                              title={info.live ? "Re-index only this page (light)" : "Needs a live plugin"}
                              onClick={() => reindexPage(p.pageId)}
                            >
                              {pageBusy[p.pageId] ? "…" : "↻"}
                            </button>
                          </div>
                          {pageMsg[p.pageId] && <div className="member"><code>{pageMsg[p.pageId]}</code></div>}
                        </div>
                      ))}
                      {detail.failures && detail.failures.length > 0 && (
                        <div className="member" style={{ display: "block" }}>
                          {detail.failures.map((f, i) => (
                            <div key={i}><code>✗ {f.pageName || f.pageId} · {f.error}</code></div>
                          ))}
                        </div>
                      )}
                      <div className="member" style={{ gap: 6 }}>
                        <button className="ghost" disabled={busy || running || !info.live} onClick={() => rebuild(projectKey, info.name)} style={smallBtn}>Rebuild project…</button>
                        <button className="ghost" disabled={!info.live} onClick={() => fetchCache(projectKey)} style={smallBtn}>Plugin cache</button>
                      </div>
                    </div>
                  )}
                  {open && cache && cache.error && <div className="member"><code>⚠ {cache.error}</code></div>}
                  {open && cache && cache.pages && (
                    <div className="member" style={{ display: "block" }}>
                      {cache.pages.map((p) => (
                        <div key={p.pageId}><code>{p.cached ? "●" : "○"} {p.name}{p.cached ? ` · ${p.nodeCount} nodes · ${fmtAge(p.builtAt)}` : ""}</code></div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      }

      // How deep the Navigator rail lets you open a page's tree: 1 = a page's
      // sections, 2 = their children, 3 = grandchildren. Rows at the cap lose
      // their caret; every row stays clickable (click = focus it in Figma).
      const MAX_NAV_DEPTH = 3;
      const NAV_INDENT = 14;   // px of indent per depth level

      // ----- Navigator panel ------------------------------------------------
      // Browse the disk index's pages/sections and drive the Figma viewport
      // from the console: click a page → set_current_page, click a section or
      // a search result → set_focus (select + scroll). Reads work from the
      // disk index alone; goto/focus need a live plugin (relay answers 503).
      function NavigatorPanel({ projects, onProjectChange }) {
        const [projectKey, setProjectKey] = useState("");
        const [pages, setPages] = useState(null);       // GET /navigator/pages result
        const [expanded, setExpanded] = useState({});   // pageId -> bool
        const [query, setQuery] = useState("");
        const [searchResults, setSearchResults] = useState(null);
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState(null);
        const [pendingId, setPendingId] = useState(null); // row with an in-flight goto/focus
        const [selected, setSelected] = useState(null);   // {id, name, pageName, kind:"page"|"node"} — persists until cleared
        const [rowErrors, setRowErrors] = useState({});   // row id -> inline error
        const [pageOverride, setPageOverride] = useState(null); // current-page highlight after our own goto/focus page switches
        const [childExpanded, setChildExpanded] = useState({}); // nodeId -> bool (subtree expansion)
        const [childrenMap, setChildrenMap] = useState({});     // nodeId -> {loading}|{error}|{children,total,truncated,ambiguous}

        // Selectable projects: live ones first, then disk-index-only ones
        // (pages/search still work offline; goto/focus answer 503).
        const [diskProjects, setDiskProjects] = useState([]);
        useEffect(() => {
          (async () => {
            try {
              const r = await fetch(relayApiUrl("index/status"));
              const data = await r.json();
              setDiskProjects((data.diskIndexes || []).map((d) => ({ projectKey: d.projectKey, name: d.projectName || d.projectKey })));
            } catch {}
          })();
        }, []);
        const options = projects.map((p) => ({ key: p.projectKey, name: p.name, live: true }));
        for (const d of diskProjects) {
          if (!options.some((o) => o.key === d.projectKey)) options.push({ key: d.projectKey, name: d.name, live: false });
        }

        const effectiveKey = projectKey || (options[0] && options[0].key) || "";
        // Tell the parent which project is being navigated (drives the live
        // preview pane sitting next to this rail on the Navigator tab).
        useEffect(() => { if (onProjectChange) onProjectChange(effectiveKey); }, [effectiveKey, onProjectChange]);
        const liveProject = projects.find((p) => p.projectKey === effectiveKey);
        // Current page: our own goto/focus page switch wins (the plugin's
        // announce can lag), else the page announced by the plugin.
        const announcedPageName = liveProject
          && liveProject.connections
          && liveProject.connections.map((c) => c.document && c.document.page).find(Boolean);
        const currentPageName = pageOverride || announcedPageName;

        const loadPages = useCallback(async (key) => {
          if (!key) return;
          setError(null);
          try {
            const r = await fetch(relayApiUrl("navigator/pages") + `?project=${encodeURIComponent(key)}`);
            const data = await r.json();
            if (!r.ok) { setPages(null); setError(data.error || `HTTP ${r.status}`); return; }
            setPages(data);
          } catch (e) { setPages(null); setError(String(e)); }
        }, []);

        useEffect(() => {
          setPages(null); setSearchResults(null); setExpanded({});
          setSelected(null); setRowErrors({}); setPendingId(null);
          setPageOverride(null); setChildExpanded({}); setChildrenMap({});
          if (effectiveKey) loadPages(effectiveKey);
        }, [effectiveKey, loadPages]);

        // Row-scoped POST: pressed/loading state on the clicked row, inline
        // error on that row on failure. Returns the response body on success,
        // null on failure.
        const post = async (endpoint, body, rowId) => {
          setPendingId(rowId);
          setRowErrors((s) => ({ ...s, [rowId]: null }));
          try {
            const r = await fetch(relayApiUrl(endpoint), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ project: effectiveKey, ...body }),
            });
            const data = await r.json();
            if (!r.ok) { setRowErrors((s) => ({ ...s, [rowId]: data.error || `HTTP ${r.status}` })); return null; }
            return data;
          } catch (e) {
            setRowErrors((s) => ({ ...s, [rowId]: String(e) }));
            return null;
          } finally { setPendingId(null); }
        };

        const goto = async (pageId, pageName) => {
          if (pendingId) return;
          const data = await post("navigator/goto", { pageId }, pageId);
          if (data) {
            setSelected({ id: pageId, name: pageName, pageName, kind: "page" });
            setPageOverride(pageName);
          }
        };
        const focus = async (nodeId, name, pageName) => {
          if (pendingId) return;
          const data = await post("navigator/focus", { nodeId }, nodeId);
          if (data) {
            setSelected({ id: nodeId, name, pageName: pageName || null, kind: "node" });
            // The plugin switches pages for cross-page focus and reports it;
            // move the current-page highlight along with it.
            const sp = data.result && data.result.switchedPage;
            if (sp && sp.name) setPageOverride(sp.name);
          }
        };

        // Subtree expansion: direct children of any indexed node, derived from
        // the disk index's path chains (GET /navigator/children). That endpoint
        // works at any depth; MAX_NAV_DEPTH is what the rail chooses to show.
        const toggleChildren = (sectionId) => {
          const open = !!childExpanded[sectionId];
          setChildExpanded((s) => ({ ...s, [sectionId]: !open }));
          if (open || childrenMap[sectionId]) return;
          setChildrenMap((s) => ({ ...s, [sectionId]: { loading: true } }));
          (async () => {
            try {
              const r = await fetch(relayApiUrl("navigator/children") + `?project=${encodeURIComponent(effectiveKey)}&nodeId=${encodeURIComponent(sectionId)}`);
              const data = await r.json();
              setChildrenMap((s) => ({ ...s, [sectionId]: r.ok ? data : { error: data.error || `HTTP ${r.status}` } }));
            } catch (e) {
              setChildrenMap((s) => ({ ...s, [sectionId]: { error: String(e) } }));
            }
          })();
        };

        const search = async () => {
          const q = query.trim();
          if (!q || !effectiveKey) return;
          setBusy(true); setError(null);
          try {
            const r = await fetch(relayApiUrl("navigator/search") + `?project=${encodeURIComponent(effectiveKey)}&q=${encodeURIComponent(q)}&limit=50`);
            const data = await r.json();
            if (!r.ok) { setSearchResults(null); setError(data.error || `HTTP ${r.status}`); return; }
            setSearchResults(data.results || []);
          } catch (e) { setError(String(e)); }
          finally { setBusy(false); }
        };

        // One row per indexed node, recursing into the children the index knows
        // about. Depth 1 is a page's sections; MAX_NAV_DEPTH caps how far down
        // the rail lets you open.
        const renderNode = (n, depth, pageName) => {
          const childOpen = !!childExpanded[n.id];
          const kids = childrenMap[n.id];
          const canExpand = depth < MAX_NAV_DEPTH;
          const indent = NAV_INDENT * depth;
          const isSelected = selected && selected.id === n.id;
          return (
            <React.Fragment key={n.id}>
              <div
                className={"nav-row section-row" + (isSelected ? " selected" : "") + (pendingId === n.id ? " pending" : "")}
                style={{ marginLeft: indent }}
                onClick={() => focus(n.id, n.name || n.id, pageName)}
                title={`Focus ${n.id} (select + scroll)`}
              >
                <span className="badge">{n.type}</span>
                <span className="nav-name">{n.name || "(unnamed)"}</span>
                {pendingId === n.id && <span className="badge">…</span>}
                {pendingId !== n.id && isSelected && <span className="badge sel-badge">selected</span>}
                {canExpand && (
                  <button
                    className="nav-caret"
                    onClick={(e) => { e.stopPropagation(); toggleChildren(n.id); }}
                    title="Show children"
                  >
                    {childOpen ? "▾" : "▸"}
                  </button>
                )}
              </div>
              {rowErrors[n.id] && <div className="nav-row-error" style={{ marginLeft: indent }}>⚠ {rowErrors[n.id]}</div>}
              {canExpand && childOpen && kids && kids.loading && (
                <div className="member muted" style={{ marginLeft: indent + NAV_INDENT }}>Loading children…</div>
              )}
              {canExpand && childOpen && kids && kids.error && (
                <div className="nav-row-error" style={{ marginLeft: indent + NAV_INDENT }}>⚠ {kids.error}</div>
              )}
              {canExpand && childOpen && kids && kids.children && !kids.children.length && (
                <div className="member muted" style={{ marginLeft: indent + NAV_INDENT }}>No children in the index.</div>
              )}
              {canExpand && childOpen && kids && kids.children && kids.children.map((c) => renderNode(c, depth + 1, pageName))}
              {canExpand && childOpen && kids && kids.children && (kids.truncated || kids.ambiguous) && (
                <div className="member muted" style={{ marginLeft: indent + NAV_INDENT, fontSize: 11 }}>
                  {kids.truncated ? `showing ${kids.children.length} of ${kids.total}` : ""}
                  {kids.truncated && kids.ambiguous ? " · " : ""}
                  {kids.ambiguous ? "same-named siblings — children merged" : ""}
                </div>
              )}
            </React.Fragment>
          );
        };

        const selStyle = { width: "100%", boxSizing: "border-box", marginBottom: 4, background: "var(--panel2)", color: "var(--text)", border: "1px solid var(--border)", borderRadius: 4, padding: "3px 6px", fontSize: 12 };
        const rowBtn = { padding: "1px 7px", fontSize: 11 };
        return (
          <div className="section">
            <h2>Navigator</h2>
            <select style={selStyle} value={projectKey} onChange={(e) => setProjectKey(e.target.value)}>
              {!options.length && <option value="">(no projects)</option>}
              {options.map((o) => <option key={o.key} value={o.key}>{o.name}{o.live ? "" : " (offline — browse only)"}</option>)}
            </select>
            <div className="row" style={{ marginBottom: 6 }}>
              <input
                style={{ ...selStyle, marginBottom: 0 }}
                placeholder="search nodes… (Enter)"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") search(); }}
              />
              <button className="ghost" style={rowBtn} disabled={busy || !query.trim() || !effectiveKey} onClick={search}>Search</button>
              {searchResults && <button className="ghost" style={rowBtn} onClick={() => { setSearchResults(null); setQuery(""); }}>✕</button>}
            </div>
            {selected && (
              <div className="nav-selected-banner">
                <code title={selected.id}>
                  Selected: {selected.name || selected.id}
                  {selected.kind === "node" && selected.pageName ? ` (${selected.pageName})` : ""}
                </code>
                <button className="ghost" title="Clear selection" onClick={() => setSelected(null)}>✕</button>
              </div>
            )}
            {error && <div className="member"><code>⚠ {error}</code></div>}
            {searchResults && (
              <div className="chan-card nav-card">
                <div className="chan-head"><span className="doc-name">Results</span><span className="badge">{searchResults.length}</span></div>
                {!searchResults.length && <div className="member muted">No matches in the disk index.</div>}
                {searchResults.map((n) => (
                  <React.Fragment key={n.id}>
                    <div
                      className={"nav-row section-row" + (selected && selected.id === n.id ? " selected" : "") + (pendingId === n.id ? " pending" : "")}
                      style={{ marginLeft: 0 }}
                      onClick={() => focus(n.id, n.name || n.id, n.pageName)}
                      title={`Focus ${n.id} (select + scroll)`}
                    >
                      <span className="badge">{n.annotation ? "★" : (n.type || "?")}</span>
                      <span className="nav-name">{n.name || "(unnamed)"}{n.pageName ? ` · ${n.pageName}` : ""}</span>
                      {pendingId === n.id && <span className="badge">…</span>}
                      {pendingId !== n.id && selected && selected.id === n.id && <span className="badge sel-badge">selected</span>}
                    </div>
                    {rowErrors[n.id] && <div className="nav-row-error">⚠ {rowErrors[n.id]}</div>}
                  </React.Fragment>
                ))}
              </div>
            )}
            {!effectiveKey && <div className="muted">No live or indexed Figma projects yet.</div>}
            {effectiveKey && !pages && !error && <div className="muted">Loading pages…</div>}
            {pages && pages.pages.map((p) => {
              const isCurrent = currentPageName && p.pageName === currentPageName;
              const open = !!expanded[p.pageId];
              return (
                <div className={"chan-card nav-card" + (isCurrent ? " current-page" : "")} key={p.pageId}>
                  {/* The WHOLE row triggers goto; only the caret button toggles sections. */}
                  <div
                    className={"nav-row page-row" + (selected && selected.id === p.pageId ? " selected" : "") + (pendingId === p.pageId ? " pending" : "")}
                    onClick={() => goto(p.pageId, p.pageName || p.pageId)}
                    title="Go to this page in Figma"
                  >
                    <span className={"nav-name" + (isCurrent ? " current" : "")}>
                      {isCurrent ? "● " : ""}{p.pageName || p.pageId}
                    </span>
                    {pendingId === p.pageId && <span className="badge">…</span>}
                    {pendingId !== p.pageId && selected && selected.id === p.pageId && <span className="badge sel-badge">selected</span>}
                    <button
                      className="nav-caret"
                      onClick={(e) => { e.stopPropagation(); setExpanded((s) => ({ ...s, [p.pageId]: !open })); }}
                      title="Show sections"
                    >
                      {open ? "▾" : "▸"} {p.sections.length}
                    </button>
                  </div>
                  {rowErrors[p.pageId] && <div className="nav-row-error">⚠ {rowErrors[p.pageId]}</div>}
                  {open && !p.sections.length && <div className="member muted" style={{ marginLeft: NAV_INDENT }}>No sections on this page.</div>}
                  {open && p.sections.map((s) => renderNode(s, 1, p.pageName))}
                </div>
              );
            })}
            {pages && (
              <div className="member"><code className="muted">index built {fmtAge(pages.builtAt)} · updated {fmtAge(pages.updatedAt)}</code></div>
            )}
          </div>
        );
      }

      // ----- Project context panel ------------------------------------------
      // Per-project structure guide (the Figma-side CLAUDE.md). SoR is the
      // Figma document itself; the relay serves a cached copy (stale:true)
      // when no plugin is online, and writes require a live plugin.
      function ProjectContextPanel({ projects }) {
        const [projectKey, setProjectKey] = useState("");
        const [doc, setDoc] = useState(null);     // last GET response
        const [text, setText] = useState("");
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState(null);
        const [savedAt, setSavedAt] = useState(null);

        const effectiveKey = projectKey || (projects[0] && projects[0].projectKey) || "";

        const load = useCallback(async (key) => {
          if (!key) return;
          setBusy(true); setError(null); setSavedAt(null);
          try {
            const r = await fetch(relayApiUrl("project-context") + `?project=${encodeURIComponent(key)}`);
            const data = await r.json();
            if (!r.ok && r.status !== 404) { setError(data.error || `HTTP ${r.status}`); setDoc(null); setText(""); return; }
            setDoc(data);
            setText(data.content || "");
          } catch (e) { setError(String(e)); }
          finally { setBusy(false); }
        }, []);

        useEffect(() => { if (effectiveKey) load(effectiveKey); }, [effectiveKey, load]);

        const save = async () => {
          setBusy(true); setError(null); setSavedAt(null);
          try {
            const r = await fetch(relayApiUrl("project-context") + `?project=${encodeURIComponent(effectiveKey)}`, {
              method: "PUT",
              headers: { "Content-Type": "text/plain; charset=utf-8" },
              body: text,
            });
            const data = await r.json();
            if (!r.ok) { setError(data.error || `HTTP ${r.status}`); return; }
            setSavedAt(data.updatedAt || new Date().toISOString());
            load(effectiveKey);
          } catch (e) { setError(String(e)); }
          finally { setBusy(false); }
        };

        const selStyle = { width: "100%", boxSizing: "border-box", marginBottom: 4, background: "var(--panel2)", color: "var(--text)", border: "1px solid var(--border)", borderRadius: 4, padding: "3px 6px", fontSize: 12 };
        return (
          <div className="section">
            <h2>Project Context</h2>
            <select style={selStyle} value={projectKey} onChange={(e) => setProjectKey(e.target.value)}>
              {!projects.length && <option value="">(no live projects)</option>}
              {projects.map((p) => <option key={p.projectKey} value={p.projectKey}>{p.name}</option>)}
            </select>
            {doc && doc.stale && <div className="member"><code>⚠ cached copy (plugin offline) · cached {doc.cachedAt ? new Date(doc.cachedAt).toLocaleString() : "?"}</code></div>}
            {doc && doc.source === "live" && doc.updatedAt && <div className="member"><code>updated {new Date(doc.updatedAt).toLocaleString()}{doc.updatedBy ? ` · ${doc.updatedBy}` : ""}</code></div>}
            {doc && (doc.exists === false || doc.source === "none") && <div className="member muted">No context document yet. 페이지 용도·명명 규칙·기능 위치·오인 지점을 기록하면 에이전트가 프로젝트 진입 시 자동으로 읽는다.</div>}
            <textarea rows={10} spellCheck={false} value={text} onChange={(e) => setText(e.target.value)}
              placeholder={"# 프로젝트 구조 가이드 (markdown)\n\n## 페이지 용도\n- 레퍼런스: 타사 캡처 모음 (우리 디자인 아님)\n..."}
              style={{ width: "100%", boxSizing: "border-box", marginTop: 4, fontSize: 12 }} />
            <div className="row" style={{ marginTop: 4 }}>
              <button className="ghost" disabled={busy || !effectiveKey} onClick={() => load(effectiveKey)}>Reload</button>
              <button className="ghost" disabled={busy || !effectiveKey || (doc && doc.stale)} onClick={save}>Save to document</button>
            </div>
            {savedAt && <div className="member"><code>saved · {new Date(savedAt).toLocaleString()}</code></div>}
            {error && <div className="member"><code>⚠ {error}</code></div>}
          </div>
        );
      }

      // ----- Script runner panel --------------------------------------------
      // Arbitrary figma-API script execution in the plugin sandbox (gap
      // filler for features without a dedicated command). Console is behind
      // the nexus admin-token gate. Return value comes back serialized;
      // errors come back as message+stack. No auto-commit — undo is Figma's.
      function ScriptPanel({ projects }) {
        const [projectKey, setProjectKey] = useState("");
        const [code, setCode] = useState("");
        const [paramsText, setParamsText] = useState("");
        const [busy, setBusy] = useState(false);
        const [output, setOutput] = useState(null);

        const effectiveKey = projectKey || (projects[0] && projects[0].projectKey) || "";

        const run = async () => {
          setBusy(true); setOutput(null);
          try {
            let params = undefined;
            if (paramsText.trim()) {
              try { params = JSON.parse(paramsText); }
              catch (e) { setOutput({ error: "params is not valid JSON: " + e }); setBusy(false); return; }
            }
            const r = await fetch(relayApiUrl("script/run") + `?project=${encodeURIComponent(effectiveKey)}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code, params }),
            });
            const data = await r.json();
            if (!r.ok) setOutput({ error: data.error || `HTTP ${r.status}` });
            else setOutput(data);
          } catch (e) { setOutput({ error: String(e) }); }
          finally { setBusy(false); }
        };

        const selStyle = { width: "100%", boxSizing: "border-box", marginBottom: 4, background: "var(--panel2)", color: "var(--text)", border: "1px solid var(--border)", borderRadius: 4, padding: "3px 6px", fontSize: 12 };
        const monoStyle = { width: "100%", boxSizing: "border-box", marginBottom: 4, fontFamily: "ui-monospace, Menlo, monospace", fontSize: 12 };
        return (
          <div className="section">
            <h2>Run Script</h2>
            <div className="member muted">figma 플러그인 API 전체 접근. 문서를 직접 수정할 수 있고, 동기 무한루프는 플러그인을 멈춘다(피그마에서 재실행 필요).</div>
            <select style={selStyle} value={projectKey} onChange={(e) => setProjectKey(e.target.value)}>
              {!projects.length && <option value="">(no live projects)</option>}
              {projects.map((p) => <option key={p.projectKey} value={p.projectKey}>{p.name}</option>)}
            </select>
            <textarea rows={8} spellCheck={false} value={code} onChange={(e) => setCode(e.target.value)}
              placeholder={"// (figma, params) 를 받는 async 함수 본문 — return 한 값이 결과로 온다\nreturn figma.currentPage.name;"}
              style={monoStyle} />
            <textarea rows={2} spellCheck={false} value={paramsText} onChange={(e) => setParamsText(e.target.value)}
              placeholder='params JSON (optional), e.g. {"id":"1:2"}'
              style={monoStyle} />
            <button className="ghost" disabled={busy || !effectiveKey || !code.trim()} onClick={run}>{busy ? "Running…" : "Run"}</button>
            {output && (
              <pre style={{ marginTop: 6, maxHeight: 240, overflow: "auto", background: "var(--panel2)", border: "1px solid var(--border)", borderRadius: 4, padding: 6, fontSize: 11, whiteSpace: "pre-wrap", wordBreak: "break-all" }}>
                {output.error ? "⚠ " + output.error : JSON.stringify(output, null, 2)}
              </pre>
            )}
          </div>
        );
      }

      // ----- Keyword annotations panel --------------------------------------
      function AnnotationsPanel({ projects }) {
        const [items, setItems] = useState(null);
        const [form, setForm] = useState({ keyword: "", projectKey: "", nodeId: "", note: "" });
        const [error, setError] = useState(null);

        const refresh = useCallback(async () => {
          try {
            const r = await fetch(relayApiUrl("search/annotations"));
            const data = await r.json();
            setItems(data.annotations || []);
          } catch (e) { setError(String(e)); }
        }, []);

        useEffect(() => { refresh(); }, [refresh]);

        const add = async () => {
          setError(null);
          const projectKey = form.projectKey || (projects[0] && projects[0].projectKey) || "";
          const r = await fetch(relayApiUrl("search/annotations"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ keyword: form.keyword, projectKey, nodeId: form.nodeId, note: form.note || undefined }),
          });
          const data = await r.json();
          if (!r.ok) { setError(data.error || "failed"); return; }
          setForm({ keyword: "", projectKey: form.projectKey, nodeId: "", note: "" });
          refresh();
        };

        const remove = async (a) => {
          await fetch(relayApiUrl("search/annotations") + `?keyword=${encodeURIComponent(a.keyword)}&projectKey=${encodeURIComponent(a.projectKey)}&nodeId=${encodeURIComponent(a.nodeId)}`, { method: "DELETE" });
          refresh();
        };

      function RequestExplorer({ projects }) {
        const [channel, setChannel] = useState("");
        const [command, setCommand] = useState("get_document_info");
        const [values, setValues] = useState({});
        const [busy, setBusy] = useState(false);
        const [result, setResult] = useState(null);
        const wsRef = useRef(null);
        const stateRef = useRef({ channel: null, joined: false, pending: new Map() });
        const connections = useMemo(() => projects.filter((p) => p.recommendedChannel), [projects]);

        const spec = useMemo(() => COMMAND_CATALOG.find((c) => c.command === command), [command]);
        const grouped = useMemo(() => {
          const m = {};
          for (const c of COMMAND_CATALOG) (m[c.group] = m[c.group] || []).push(c);
          return m;
        }, []);

        // default project = first live project; relay already chose its least-loaded connection
        useEffect(() => {
          if (!channel && connections.length) {
            setChannel(connections[0].recommendedChannel);
          }
        }, [connections, channel]);

        // reset form to defaults when the command changes
        useEffect(() => {
          const init = {};
          if (spec) {
            for (const p of spec.params) {
              if ((p.type === "number" || p.type === "boolean" || p.type === "enum" || p.type === "string")
                  && p.default !== undefined) {
                init[p.name] = p.default;
              }
            }
          }
          setValues(init);
          setResult(null);
        }, [command]);

        const preview = useMemo(() => {
          if (!spec) return "";
          try {
            return JSON.stringify({ command, params: buildParams(spec, values) }, null, 2);
          } catch (e) {
            return "// " + e.message;
          }
        }, [spec, command, values]);

        function ensureSocket(target) {
          const st = stateRef.current;
          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN && st.channel === target && st.joined) {
            return Promise.resolve();
          }
          if (wsRef.current) { try { wsRef.current.close(); } catch {} }
          return new Promise((resolve, reject) => {
            const ws = new WebSocket(WS_URL);
            ws.binaryType = "arraybuffer";
            wsRef.current = ws;
            st.channel = target; st.joined = false; st.pending = new Map();
            const to = setTimeout(() => reject(new Error("connect/join timeout")), 8000);
            // join as a controller (so the server labels us controller, not figma)
            ws.onopen = () => {
              ws.send(JSON.stringify({ type: "hello", role: "controller", requesterId: "dashboard", protocolVersion: RELAY_PROTOCOL_VERSION, deviceName: "Web console", platform: navigator.platform || navigator.userAgent, capabilities: ["binaryFrames", "livePreview"] }));
              ws.send(JSON.stringify({ type: "join", channel: target, requesterId: "dashboard", id: genId(), message: { command: "join" } }));
            };
            ws.onerror = () => { clearTimeout(to); reject(new Error("socket error")); };
            ws.onmessage = (ev) => {
              let d;
              try {
                if (typeof ev.data === "string") d = JSON.parse(ev.data);
                else {
                  const decoded = decodeBinaryFrame(ev.data);
                  d = decoded.envelope;
                  if (d.message?.result) {
                    d.message.result = { ...d.message.result, binary: true, byteLength: decoded.payload.byteLength };
                  }
                }
              } catch { return; }
              if (d.type === "system" && d.event === "protocol_mismatch") {
                clearTimeout(to); reject(new Error(d.message)); return;
              }
              if (!st.joined && d.type === "system" && d.message && d.message.result) {
                st.joined = true; clearTimeout(to); resolve(); return;
              }
              const m = d.message;
              if (m && m.id && st.pending.has(m.id)) {
                const cb = st.pending.get(m.id); st.pending.delete(m.id); cb(m);
              }
            };
          });
        }

        async function send() {
          // build + validate params
          let params;
          try {
            params = buildParams(spec, values);
          } catch (e) {
            setResult({ error: "Param error — " + e.message });
            return;
          }
          const missing = spec.params.filter((p) => p.required && params[p.name] === undefined).map((p) => p.name);
          if (missing.length) {
            setResult({ error: "Missing required: " + missing.join(", ") });
            return;
          }
          setBusy(true); setResult(null);
          try {
            await ensureSocket(channel);
            const id = genId();
            const st = stateRef.current;
            const startedAt = performance.now();
            const done = new Promise((resolve) => {
              const timer = setTimeout(() => { st.pending.delete(id); resolve({ error: "Timed out after 30s" }); }, 30000);
              st.pending.set(id, (m) => { clearTimeout(timer); resolve(m); });
            });
            wsRef.current.send(JSON.stringify({
              id, type: "message", channel,
              message: { id, command, params: { ...params, commandId: id } },
            }));
            const m = await done;
            const ms = Math.round(performance.now() - startedAt);
            setResult(m.error ? { error: m.error, ms } : { result: m.result, ms });
          } catch (e) {
            setResult({ error: e.message });
          } finally {
            setBusy(false);
          }
        }

        return (
          <div className="explorer">
            <div className="exp-top">
              <div className="exp-field">
                <label>Figma Project</label>
                <select value={channel} onChange={(e) => setChannel(e.target.value)}>
                  {connections.length === 0 && <option value="">(no projects)</option>}
                  {connections.map((project) => (
                    <option key={project.projectKey} value={project.recommendedChannel}>
                      {project.name} ({project.connectionCount} connections · busy {project.busy || 0})
                    </option>
                  ))}
                </select>
              </div>
              <div className="exp-field">
                <label>Command</label>
                <select value={command} onChange={(e) => setCommand(e.target.value)}>
                  {Object.entries(grouped).map(([g, cmds]) => (
                    <optgroup key={g} label={g}>
                      {cmds.map((c) => <option key={c.command} value={c.command}>{c.command}</option>)}
                    </optgroup>
                  ))}
                </select>
              </div>
            </div>
            <div className="exp-desc">{spec?.description}</div>

            <div className="exp-body">
              <div className="exp-form">
                <h4>Parameters</h4>
                {spec && spec.params.length === 0 && <div className="muted">No parameters.</div>}
                {spec && spec.params.map((p) => (
                  <Field key={p.name} p={p} value={values[p.name]} onChange={(v) => setValues((s) => ({ ...s, [p.name]: v }))} />
                ))}
              </div>
              <div className="exp-side">
                <h4>Request</h4>
                <pre className="exp-preview">{preview}</pre>
                <button onClick={send} disabled={busy || !channel}>{busy ? "Sending…" : "Send"}</button>
                {result && (
                  <div className="result-box">
                    <div className={result.error ? "bad" : "ok"}>
                      {result.error ? "✗ error" : "✓ response"}{result.ms != null ? ` · ${result.ms}ms` : ""}
                    </div>
                    <pre>{JSON.stringify(result.error ?? result.result, null, 2)}</pre>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ----- Virtualized log list -------------------------------------------
      const KINDS = ["command", "started", "result", "bulk", "timeout", "unstable", "heartbeat_timeout", "join", "connect", "disconnect", "progress", "document", "channel_closed"];

      function LogPanel({ getEvents, version, filter, setFilter }) {
        const [enabled, setEnabled] = useState(() => new Set(KINDS));
        const [autoscroll, setAutoscroll] = useState(true);
        const [selected, setSelected] = useState(null);

        const listRef = useRef(null);

        const filtered = useMemo(() => {
          const all = getEvents();
          const f = filter.trim().toLowerCase();
          return all.filter((e) => {
            if (!enabled.has(e.kind)) return false;
            if (!f) return true;
            return (e.command || "").toLowerCase().includes(f)
              || (e.channel || "").toLowerCase().includes(f)
              || (e.commandId || "").toLowerCase().includes(f)
              || (e.requesterId || "").toLowerCase().includes(f)
              || (e.batchId || e.id || "").toLowerCase().includes(f)
              || summarize(e).toLowerCase().includes(f);
          });
        // eslint-disable-next-line
        }, [version, filter, enabled]);

        useEffect(() => {
          if (autoscroll && listRef.current && filtered.length) {

          }
        }, [filtered.length, autoscroll]);

        const toggleKind = (k) => setEnabled((prev) => {
          const n = new Set(prev); n.has(k) ? n.delete(k) : n.add(k); return n;
        });

        const Row = useCallback(({ index, style }) => {

          return (
