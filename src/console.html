              style={style}
              onClick={() => setSelected(e)}
            >
              <span className="ts">{fmtTime(e.ts)}</span>
              <span className={"kind " + e.kind + errCls}>{e.kind}</span>
              <span className="chan-col">{e.channel ? "#" + e.channel : ""}</span>
              <span className="summary">{summarize(e)}</span>
            </div>
          );
        }, [filtered, selected]);

        return (
          <>
            <div className="toolbar">
              <input type="text" placeholder="filter… channel / requester / command / bulk id" value={filter} onChange={(e) => setFilter(e.target.value)} />
              {filter && <button className="ghost" style={{ padding: "4px 8px" }} onClick={() => setFilter("")}>clear</button>}
              {KINDS.map((k) => (
                <label className="chk" key={k}>
                  <input type="checkbox" checked={enabled.has(k)} onChange={() => toggleKind(k)} /> {k}
                </label>
              ))}
              <label className="chk">
                <input type="checkbox" checked={autoscroll} onChange={(e) => setAutoscroll(e.target.checked)} /> autoscroll
              </label>
              <span className="muted" style={{ marginLeft: "auto" }}>{filtered.length} shown</span>
            </div>
            <div className="list-host" ref={hostRef}>
              {h > 0 && (
                <FixedSizeList
                  height={h}
                  width="100%"
                  itemCount={filtered.length}
                  itemSize={ROW_H}
                  ref={listRef}
                >
                  {Row}
                </FixedSizeList>
              )}
            </div>
            {selected && (
              <div className="detail">
                <pre>{JSON.stringify(selected, null, 2)}</pre>
              </div>
            )}
          </>
        );
      }

      // ----- Root app --------------------------------------------------------
      function App() {
        const [connected, setConnected] = useState(false);
        const [relayVersion, setRelayVersion] = useState(null);
        const [channels, setChannels] = useState([]);
        const [projects, setProjects] = useState([]);
        const [bulkJobs, setBulkJobs] = useState([]);
        const bufRef = useRef([]);       // ring buffer of events
        const queueRef = useRef([]);     // pending events between flushes
        const pausedRef = useRef(false);
        const [paused, setPaused] = useState(false);
        const [version, setVersion] = useState(0); // bumped on flush to trigger renders
        const [filter, setFilter] = useState("");  // shared: channel click sets this
        const [view, setView] = useState("navigator"); // top GNB: one feature group per screen; Navigator is the working screen, Overview is logging/status
        const [selectedProject, setSelectedProject] = useState(null);
        const [navProjectKey, setNavProjectKey] = useState(null); // Navigator tab's project
        const [preview, setPreview] = useState(null);
        // WebRTC live stream state. Media goes browser <-> capture machine
        // directly (STUN only); on any failure the console falls back to the
        // relayed JPEG frames rather than trying a TURN hop.
        const [rtc, setRtc] = useState({ status: "off", stream: null });
        const [qualityKey, setQualityKey] = useState(loadQualityKey());
        const qualityKeyRef = useRef(qualityKey);
        const rtcRef = useRef(null); // { channel, pc, timer }
        const seqRef = useRef(0);
        const monitorRef = useRef(null); // live monitor socket, for sending actions
        const desiredPreviewChannelRef = useRef(null);

        pausedRef.current = paused;

        const getEvents = useCallback(() => bufRef.current, []);

        // These touch only refs and setState (all stable), so the versions the
        // mount-effect's socket handlers capture stay correct forever.
        const wsSend = (payload) => {
          const ws = monitorRef.current;
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
        };
        const stopRtc = (notifyRelay = true) => {
          const current = rtcRef.current;
          rtcRef.current = null;
          if (current) {
            clearTimeout(current.timer);
            try { current.pc && current.pc.close(); } catch {}
          }
          if (notifyRelay) wsSend({ type: "webrtc_stop" });
        };
        const fallbackToJpeg = (channel) => {
          stopRtc();
          setRtc({ status: "fallback", stream: null });
          wsSend({ type: "preview_subscribe", channel, mode: "app-window" });
        };
        const startRtc = (channel) => {
          stopRtc();
          setRtc({ status: "connecting", stream: null });
          wsSend({ type: "webrtc_start", channel, quality: qualityOf(qualityKeyRef.current) });
          rtcRef.current = {
            channel,
            pc: null,
            // ICE that has not connected in 10s is not going to; JPEG instead.
            timer: setTimeout(() => fallbackToJpeg(channel), 10000),
          };
        };
        const changeQuality = (key) => {
          setQualityKey(key);
          qualityKeyRef.current = key;
          saveQualityKey(key);
          const current = rtcRef.current;
          if (current) wsSend({ type: "preview_quality", channel: current.channel, quality: qualityOf(key) });
        };
        const sendPreviewInput = (input) => {
          const channel = desiredPreviewChannelRef.current;
          if (channel) wsSend({ type: "preview_input", channel, input });
        };

        useEffect(() => {
          let ws, alive = true, retry;
          const connect = () => {
            ws = new WebSocket(WS_URL);
            ws.binaryType = "arraybuffer";
            monitorRef.current = ws;
            ws.onopen = () => {
              setConnected(true);
              ws.send(JSON.stringify({ type: "hello", role: "controller", requesterId: "dashboard-monitor", protocolVersion: PROTOCOL_VERSION, deviceName: "Web console monitor", platform: navigator.platform || navigator.userAgent, capabilities: ["binaryFrames", "livePreview"] }));
              ws.send(JSON.stringify({ type: "monitor" }));
              if (desiredPreviewChannelRef.current) {
                // The server-side peer died with the old socket; renegotiate.
                startRtc(desiredPreviewChannelRef.current);
              }
            };
            ws.onclose = () => { setConnected(false); if (alive) retry = setTimeout(connect, 1500); };
            ws.onerror = () => { try { ws.close(); } catch {} };
            ws.onmessage = (ev) => {
              let msg;
              let previewPayload;
              try {
                if (typeof ev.data === "string") {
                  msg = JSON.parse(ev.data);
                } else {
                  const decoded = decodeBinaryFrame(ev.data);
                  msg = decoded.envelope;
                  previewPayload = decoded.payload;
                }
              } catch { return; }
              if (msg.type === "webrtc_offer") {
                const current = rtcRef.current;
                if (!current || current.channel !== msg.channel) return;
                const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
                current.pc = pc;
                pc.ontrack = (e) => {
                  const stream = e.streams && e.streams[0] ? e.streams[0] : new MediaStream([e.track]);
                  setRtc((previous) => ({ ...previous, stream }));
                };
                pc.onicecandidate = (e) => {
                  if (e.candidate) wsSend({ type: "webrtc_ice", candidate: e.candidate.toJSON() });
                };
                pc.oniceconnectionstatechange = () => {
                  const state = pc.iceConnectionState;
                  const live = rtcRef.current;
                  if (!live || live.pc !== pc) return;
                  if (state === "connected" || state === "completed") {
                    clearTimeout(live.timer);
                    setRtc((previous) => ({ ...previous, status: "live" }));
                  } else if (state === "failed" || state === "disconnected") {
                    fallbackToJpeg(live.channel);
                  }
                };
                (async () => {
                  try {
                    await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    wsSend({ type: "webrtc_answer", sdp: answer.sdp });
                  } catch (error) {
                    fallbackToJpeg(msg.channel);
                  }
                })();
                return;
              }
              if (msg.type === "webrtc_ice") {
                const current = rtcRef.current;
                if (current && current.pc) current.pc.addIceCandidate(msg.candidate).catch(() => {});
                return;
              }
              if (msg.type === "webrtc_error") {
                const current = rtcRef.current;
                if (current && current.channel === msg.channel) fallbackToJpeg(msg.channel);
                return;
              }
              if (msg.type === "webrtc_state") return; // relay-side ICE state, informational

              if (msg.kind === "preview_frame") {
                const bytes = previewPayload || (msg.preview?.imageData
                  ? Uint8Array.from(atob(msg.preview.imageData), (c) => c.charCodeAt(0))
                  : null);
                if (bytes) {
                  const url = URL.createObjectURL(new Blob([bytes], { type: msg.preview?.mimeType || "image/png" }));
                  setPreview((previous) => {
                    if (previous?.url) URL.revokeObjectURL(previous.url);
                    return { url, meta: msg.preview };
                  });
                }
                return;
              }
              if (msg.kind === "preview_error") {
                setPreview((previous) => {
                  if (previous?.url) URL.revokeObjectURL(previous.url);
                  return { error: msg.error || "Preview failed" };
                });
                return;
              }
              if (msg.protocolVersion) {
                RELAY_PROTOCOL_VERSION = msg.protocolVersion;
                setRelayVersion(msg.protocolVersion);
              }
              if (msg.kind === "snapshot") {
                setChannels(msg.channels || []);
                setProjects(msg.projects || []);
                setBulkJobs(msg.bulkJobs || []);
                (msg.log || []).forEach((e) => { e._i = ++seqRef.current; });
                bufRef.current = (msg.log || []).slice(-RING);
                setVersion((v) => v + 1);
              } else if (msg.kind === "channels") {
                setChannels(msg.channels || []);
                setProjects(msg.projects || []);
                setBulkJobs(msg.bulkJobs || []);
              } else if (msg.kind === "event") {
                if (!pausedRef.current) queueRef.current.push(msg.event);
              }
            };
          };
          connect();

          const flush = setInterval(() => {
            if (!queueRef.current.length) return;
            const incoming = queueRef.current;
            queueRef.current = [];
            for (const e of incoming) { e._i = ++seqRef.current; bufRef.current.push(e); }
            if (bufRef.current.length > RING) bufRef.current.splice(0, bufRef.current.length - RING);
            setVersion((v) => v + 1);
          }, FLUSH_MS);

          return () => { alive = false; clearTimeout(retry); clearInterval(flush); try { ws.close(); } catch {} };
        }, []);

        // Live preview follows whichever screen is showing it: the Overview's
        // selected project card, or the Navigator tab's selected project.
        const navProject = projects.find((p) => p.projectKey === navProjectKey) || null;
        const desiredPreviewChannel =
          view === "overview" && selectedProject ? selectedProject.recommendedChannel
          : view === "navigator" && navProject ? navProject.recommendedChannel
          : null;
        desiredPreviewChannelRef.current = desiredPreviewChannel;
        useEffect(() => {
          // Drop the JPEG subscription and any old peer, then try WebRTC for
          // the new channel; JPEG comes back only as the fallback.
          wsSend({ type: "preview_subscribe", channel: null, mode: "app-window" });
          setPreview((previous) => {
            if (previous?.url) URL.revokeObjectURL(previous.url);
            return null;
          });
          if (desiredPreviewChannel) {
            startRtc(desiredPreviewChannel);
          } else {
            stopRtc();
            setRtc({ status: "off", stream: null });
          }
        }, [desiredPreviewChannel]);

        const clear = () => { bufRef.current = []; queueRef.current = []; setVersion((v) => v + 1); };
        const clearEmpty = useCallback(() => {
          const ws = monitorRef.current;
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "clear_empty" }));
        }, []);

        // One feature group per screen. Overview keeps the live status +
        // event log; every other tab renders its panel full-width.
        const TABS = [
          ["navigator", "Navigator"],
          ["overview", "Overview"],
          ["index", "Index"],
          ["annotations", "Annotations"],
          ["context", "Context"],
          ["script", "Script"],
          ["errors", "Errors"],
          ["exports", "Exports"],
          ["explorer", "Explorer"],
        ];
        return (
          <>
            <div className="topbar">
              <span className={"dot " + (connected ? "on" : "off")}></span>
              <h1>Talk-to-Figma · Server Console</h1>
              <span className="view-tabs">
                {TABS.map(([id, label]) => (
                  <button key={id} className={"vtab" + (view === id ? " active" : "")} onClick={() => setView(id)}>{label}</button>
                ))}
              </span>
              <span style={{ marginLeft: "auto" }} className="row">
                {view === "overview" && <button className="ghost" onClick={() => setPaused((p) => !p)}>{paused ? "Resume" : "Pause"}</button>}
                {view === "overview" && <button className="ghost" onClick={clear}>Clear log</button>}
              </span>
            </div>
            <div className="main">
              {view === "overview" && (
                <>
                  <div className="sidebar">
                    <div className="section">
                      <h2>Relay</h2>
                      <div className="member">
                        {relayVersion && <span className="badge" title="relay protocol version">relay v{relayVersion}</span>}
                        <code className="muted">{WS_URL}</code>
                      </div>
                    </div>
                    <Projects
                      projects={projects}
                      bulkJobs={bulkJobs}
                      onProjectPick={(project) => { setSelectedProject(project); setFilter(project.name || project.projectKey); }}
                      onFilterPick={(value) => { setSelectedProject(null); setFilter(value); }}
                    />
                    <Channels channels={channels} onPick={(ch) => { setSelectedProject(null); setFilter(ch); }} onClearEmpty={clearEmpty} />
                  </div>
                  <div className="logwrap">
                    <PreviewPanel project={selectedProject} preview={preview} rtc={rtc} qualityKey={qualityKey} onQualityChange={changeQuality} onInput={sendPreviewInput} onClose={() => setSelectedProject(null)} />
                    <LogPanel getEvents={getEvents} version={version} filter={filter} setFilter={setFilter} />
                  </div>
                </>
              )}
              {view === "navigator" && (
                <div className="nav-split">
                  <div className="nav-side">
                    <NavigatorPanel projects={projects} onProjectChange={setNavProjectKey} />
                  </div>
                  <div className="nav-main">
                    {navProject
                      ? <PreviewPanel project={navProject} preview={preview} rtc={rtc} qualityKey={qualityKey} onQualityChange={changeQuality} onInput={sendPreviewInput} />
                      : <div className="nav-placeholder">
                          No live plugin for this project — the preview mirrors the Figma app window.<br />
                          Open the file in Figma and run the Talk-to-Figma plugin; browsing the index still works.
                        </div>}
                  </div>
                </div>
              )}
              {view === "index" && <div className="panel-page"><IndexPanel projects={projects} /></div>}
              {view === "annotations" && <div className="panel-page"><AnnotationsPanel projects={projects} /></div>}
              {view === "context" && <div className="panel-page"><ProjectContextPanel projects={projects} /></div>}
              {view === "script" && <div className="panel-page"><ScriptPanel projects={projects} /></div>}
              {view === "errors" && <div className="panel-page"><ErrorsPanel /></div>}
              {view === "exports" && <div className="panel-page"><ExportGallery /></div>}
              {view === "explorer" && (
                <div className="logwrap">
                  <RequestExplorer projects={projects} />
                </div>
              )}
            </div>
          </>
        );
      }

      createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
