<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talk-to-Figma · Server Console</title>
    <style>
      :root {
        --bg: #15171c;
        --panel: #1e2127;
        --panel2: #23272f;
        --border: #2e333d;
        --text: #d6dae0;
        --muted: #8a92a0;
        --blue: #4aa3ff;
        --green: #4ade80;
        --yellow: #fbbf24;
        --red: #ff6b6b;
        --purple: #b78bff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      #root { height: 100vh; display: flex; flex-direction: column; }
      .topbar {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 16px; border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      .topbar h1 { font-size: 14px; margin: 0; font-weight: 600; }
      .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
      .dot.off { background: var(--red); }
      .muted { color: var(--muted); }
      .main { flex: 1; display: flex; min-height: 0; }
      .sidebar {
        width: 320px; min-width: 280px; border-right: 1px solid var(--border);
        display: flex; flex-direction: column; background: var(--panel);
        overflow-y: auto;
      }
      .logwrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
      .section h2 {
        font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
        color: var(--muted); margin: 0 0 10px; font-weight: 600;
      }
      .chan-card {
        background: var(--panel2); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer;
      }
      .chan-card:hover { border-color: var(--blue); }
      .chan-card.dim { opacity: .6; }
      .chan-card.dim .chan-name { color: var(--muted); }
      .chan-card.warn { border-color: var(--red); }
      .warn-banner {
        margin-top: 6px; padding: 6px 8px; border-radius: 6px;
        background: #3a1717; color: #ffb3b3; font-size: 11px; line-height: 1.4;
      }
      .doc-info { margin-top: 6px; line-height: 1.4; }
      .doc-name { color: var(--green); font-weight: 600; }
      .doc-sub { color: var(--muted); font-size: 11px; margin-left: 4px; }
      .empty-folder { margin-top: 10px; }
      .folder-head {
        display: flex; align-items: center; gap: 6px; cursor: pointer;
        font-size: 12px; color: var(--muted); padding: 6px 4px;
        border-top: 1px solid var(--border); user-select: none;
      }
      .folder-head:hover { color: var(--text); }
      .caret { width: 10px; display: inline-block; }
      .chan-head { display: flex; justify-content: space-between; align-items: center; }
      .chan-name { font-family: ui-monospace, Menlo, monospace; font-weight: 600; color: var(--blue); }
      .badge {
        font-size: 10px; padding: 1px 6px; border-radius: 10px;
        border: 1px solid var(--border); color: var(--muted);
      }
      .badge.controller { color: var(--blue); }
      .badge.figma { color: var(--green); }
      .badge.monitor { color: var(--muted); }
      .badge.unknown { color: var(--yellow); }
      .member { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; }
      .member code { color: var(--muted); font-size: 11px; }
      label { display: block; font-size: 11px; color: var(--muted); margin: 8px 0 3px; }
      input, select, textarea, button {
        font-family: inherit; font-size: 12px; color: var(--text);
        background: var(--panel2); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px 8px; width: 100%;
      }
      textarea { font-family: ui-monospace, Menlo, monospace; resize: vertical; }
      button {
        width: auto; cursor: pointer; background: var(--blue); color: #06121f;
        border: none; font-weight: 600; padding: 7px 14px;
      }
      button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .row { display: flex; gap: 8px; align-items: center; }
      .toolbar {
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel);
      }
      .toolbar input[type="text"] { width: 220px; }
      .chk { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
      .chk input { width: auto; }
      .list-host { flex: 1; min-height: 0; position: relative; }
      .logrow {
        display: flex; gap: 10px; align-items: center; padding: 0 14px;
        white-space: nowrap; overflow: hidden; cursor: pointer;
        border-bottom: 1px solid #20242c; font-family: ui-monospace, Menlo, monospace;
        font-size: 12px; line-height: 26px;
      }
      .logrow:hover { background: #20242c; }
      .logrow.sel { background: #2a3140; }
      .ts { color: var(--muted); flex: 0 0 92px; }
      .kind { flex: 0 0 78px; font-weight: 600; }
      .kind.command { color: var(--blue); }
      .kind.result { color: var(--green); }
      .kind.result.err { color: var(--red); }
      .kind.join, .kind.connect { color: var(--purple); }
      .kind.disconnect { color: var(--red); }
      .kind.progress { color: var(--yellow); }
      .kind.document { color: var(--green); }
      .chan-col { flex: 0 0 90px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
      .summary { flex: 1; overflow: hidden; text-overflow: ellipsis; }
      .detail {
        height: 240px; border-top: 1px solid var(--border); background: #11131a;
        overflow: auto; padding: 10px 14px;
      }
      .detail pre { margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
      .preview-panel { border-bottom: 1px solid var(--border); background: #11131a; padding: 10px 14px; }
      .preview-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      .preview-head strong { color: var(--green); }
      .preview-head button { margin-left: auto; }
      .preview-stage { min-height: 120px; max-height: 420px; display: flex; align-items: center; justify-content: center; overflow: auto; background: #090a0d; border: 1px solid var(--border); border-radius: 7px; }
      .preview-stage img { display: block; max-width: 100%; max-height: 400px; object-fit: contain; }
      .preview-meta { color: var(--muted); font-size: 11px; margin-top: 7px; }
      .gallery-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 8px; }
      .gallery-item { background: #11131a; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; cursor: pointer; }
      .gallery-item img { width: 100%; height: 72px; object-fit: cover; display: block; background: #090a0d; }
      .gallery-caption { padding: 5px; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* View tabs in the top bar */
      .view-tabs { display: inline-flex; gap: 4px; margin-left: 16px; }
      .vtab {
        background: transparent; border: 1px solid var(--border); color: var(--muted);
        padding: 5px 12px; border-radius: 6px; font-weight: 500; cursor: pointer; width: auto;
      }
      .vtab.active { background: var(--blue); color: #06121f; border-color: var(--blue); font-weight: 600; }

      /* Request explorer (Swagger-style) */
      .explorer { display: flex; flex-direction: column; height: 100%; min-height: 0; }
      .exp-top { display: flex; gap: 12px; padding: 12px 16px 0; }
      .exp-field { flex: 1; min-width: 0; }
      .exp-desc { padding: 8px 16px; color: var(--muted); }
      .exp-body { flex: 1; display: flex; min-height: 0; gap: 0; }
      .exp-form { flex: 1; overflow-y: auto; padding: 8px 16px 24px; border-right: 1px solid var(--border); }
      .exp-form h4, .exp-side h4 {
        margin: 4px 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
      }
      .exp-side { width: 42%; min-width: 320px; display: flex; flex-direction: column; padding: 8px 16px 16px; overflow-y: auto; }
      .exp-preview {
        background: #11131a; border: 1px solid var(--border); border-radius: 6px;
        padding: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
        white-space: pre-wrap; word-break: break-word; margin: 0 0 10px; max-height: 220px; overflow: auto;
      }
      .field { margin-bottom: 12px; }
      .field-inline { display: flex; align-items: center; gap: 8px; }
      .field-inline label { margin: 0; order: 2; }
      .field-inline input { width: auto; }
      .field label { display: block; margin-bottom: 3px; }
      .field .req { color: var(--red); margin-left: 2px; }
      .field .ptype { color: var(--muted); font-size: 10px; font-weight: 400; margin-left: 4px; }
      .phint { color: var(--muted); font-size: 11px; margin-top: 2px; }
      .obj-field { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; }
      .obj-head { font-weight: 600; margin-bottom: 8px; }
      .obj-head .req { color: var(--red); }
      .obj-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .obj-body .field { margin-bottom: 0; }

      .result-box {
        margin-top: 8px; background: #11131a; border: 1px solid var(--border);
        border-radius: 6px; padding: 8px; max-height: 200px; overflow: auto;
      }
      .result-box pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
      .ok { color: var(--green); }
      .bad { color: var(--red); }
      a { color: var(--blue); }
    </style>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "react-window": "https://esm.sh/react-window@1.8.11?deps=react@18.3.1,react-dom@18.3.1"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  </head>
  <body>
    <div id="root">Loading console… (needs internet for React CDN on first load)</div>

    <script type="text/babel" data-type="module" data-presets="react">
      import React, { useEffect, useRef, useState, useMemo, useCallback } from "react";
      import { createRoot } from "react-dom/client";
      import { FixedSizeList } from "react-window";

      const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsPath = location.pathname.endsWith("/console")
        ? location.pathname.slice(0, -"console".length)
        : location.pathname;
      const WS_URL = `${wsProtocol}//${location.host}${wsPath || "/"}`;
      function relayApiUrl(endpoint) {
        const url = new URL(WS_URL);
        url.protocol = url.protocol === "wss:" ? "https:" : "http:";
        url.pathname = `${url.pathname.replace(/\/$/, "")}/${endpoint.replace(/^\//, "")}`;
        return url.toString();
      }
      const PROTOCOL_VERSION = "2.1.0";
      const RING = 5000;          // browser-side ring buffer size
      const FLUSH_MS = 150;       // batch incoming events to avoid render storms
      const ROW_H = 26;

      function genId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }

      function decodeBinaryFrame(raw) {
        const bytes = raw instanceof Uint8Array ? raw : new Uint8Array(raw);
        if (bytes.length < 8 || bytes[0] !== 0x54 || bytes[1] !== 0x54 || bytes[2] !== 0x46 || bytes[3] !== 0x42) {
          throw new Error("Invalid Talk-to-Figma binary frame");
        }
        const headerLength = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(4, false);
        const envelope = JSON.parse(new TextDecoder().decode(bytes.subarray(8, 8 + headerLength)));
        return { envelope, payload: bytes.subarray(8 + headerLength) };
      }
      function fmtTime(ts) {
        const d = new Date(ts);
        const p = (n, l = 2) => String(n).padStart(l, "0");
        return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
      }

      // Measure a DOM element's height (for react-window which needs a number)
      function useSize(ref) {
        const [size, setSize] = useState({ w: 0, h: 0 });
        useEffect(() => {
          if (!ref.current) return;
          const ro = new ResizeObserver((entries) => {
            const r = entries[0].contentRect;
            setSize({ w: r.width, h: r.height });
          });
          ro.observe(ref.current);
          return () => ro.disconnect();
        }, [ref]);
        return size;
      }

      function summarize(e) {
        switch (e.kind) {
          case "connect": return `client ${e.clientId} connected`;
          case "disconnect": return `client ${e.clientId} left ${e.channel ? "#" + e.channel : ""}`;
          case "join": return `${e.clientId} joined #${e.channel} (${e.clientCount} in channel)`;
          case "command": return `${e.command} · ${e.requesterId || "unknown"} · queue ${e.queueDepth || 0}`;
          case "started": return `${e.command} · waited ${e.waitMs || 0}ms · ${e.requesterId || "unknown"}`;
          case "result": return `${e.ok ? "ok" : "ERROR: " + (e.error || "")} · wait ${e.timing?.waitMs || 0}ms · run ${e.timing?.executionMs || 0}ms · ${e.requesterId || "unknown"}`;
          case "progress": return `${e.commandType || ""} ${e.progress ?? ""}% ${e.status || ""} ${e.message || ""}`;
          case "bulk": return `${e.id} · ${e.status} · ${e.completed || 0}/${e.total || 0} · ${e.requesterId || "unknown"}`;
          case "timeout": return `${e.command || "request"} timed out · ${e.requesterId || "unknown"}`;
          case "unstable": return `${e.clientId} unstable · timeout rate ${Math.round((e.timeoutRate || 0) * 100)}%`;
          case "document": return `${e.document?.documentName || "(untitled)"} · ${e.document?.page || ""}`;
          case "channel_closed": return `figma left → evicted ${e.evicted} client(s)`;
          default: return JSON.stringify(e);
        }
      }

      // ----- Command catalog (wire format sent to the Figma plugin) ---------
      const COMMAND_CATALOG = [
        { group: "Document & Selection", command: "get_document_info", description: "Page info + all pages (pass pageId to inspect a non-open page)", params: [
          { name: "pageId", type: "string", required: false, description: "Inspect this page instead of the current one" }
        ] },
        { group: "Document & Selection", command: "list_pages", description: "List all pages (id, name, childCount) + current page id", params: [] },
        { group: "Document & Selection", command: "set_current_page", description: "Switch the current page so current-page tools reach it", params: [
          { name: "pageId", type: "string", required: true, description: "Page id to switch to (from list_pages)" }
        ] },
        { group: "Document & Selection", command: "get_node_by_key", description: "Resolve a component/style key to a live node id", params: [
          { name: "key", type: "string", required: true, description: "Component/style key from the catalog" }
        ] },
        { group: "Document & Selection", command: "diagnose_pages", description: "Find pages/containers with an unclassifiable node + try to identify its type", params: [
          { name: "tryExport", type: "boolean", required: false, default: true, description: "REST-export skipped containers to surface the offending child type" },
          { name: "deep", type: "boolean", required: false, default: false, description: "Recurse below direct page children (slower)" }
        ] },
        { group: "Document & Selection", command: "get_selection", description: "Get information about the current selection in Figma", params: [] },
        { group: "Document & Selection", command: "read_my_design", description: "Get detailed information about the current selection, including all node details", params: [] },
        { group: "Document & Selection", command: "get_node_info", description: "Node info; use fields/maxDepth to shrink large nodes", params: [
          { name: "nodeId", type: "string", required: true, description: "The ID of the node to get information about" },
          { name: "fields", type: "json", required: false, description: "Only these top-level fields (id/name/type always kept)", example: '["fills","characters","style","componentProperties"]' },
          { name: "maxDepth", type: "number", required: false, description: "Max child levels to expand (0=node only, 1=direct children)" }
        ] },
        { group: "Document & Selection", command: "get_nodes_info", description: "Multi-node info; supports fields/maxDepth", params: [
          { name: "nodeIds", type: "json", required: true, description: "Array of node IDs", example: '["123:1","123:2"]' },
          { name: "fields", type: "json", required: false, description: "Only these top-level fields", example: '["fills","characters"]' },
          { name: "maxDepth", type: "number", required: false, description: "Max child levels to expand" }
        ] },
        { group: "Document & Selection", command: "set_focus", description: "Set focus on a node by selecting it and scrolling the viewport to it", params: [
          { name: "nodeId", type: "string", required: true, description: "The ID of the node to focus on" }
        ] },
        { group: "Document & Selection", command: "set_selections", description: "Set selection to multiple nodes and scroll the viewport to show them", params: [
          { name: "nodeIds", type: "json", required: true, description: "Array of node IDs to select", example: '["123:1","123:2"]' }
        ] },

        { group: "Creating Elements", command: "create_rectangle", description: "Create a new rectangle in Figma", params: [
          { name: "x", type: "number", required: true, description: "X position" },
          { name: "y", type: "number", required: true, description: "Y position" },
          { name: "width", type: "number", required: true, description: "Width of the rectangle" },
          { name: "height", type: "number", required: true, description: "Height of the rectangle" },
          { name: "name", type: "string", required: false, default: "Rectangle", description: "Optional name for the rectangle" },
          { name: "parentId", type: "string", required: false, description: "Optional parent node ID to append the rectangle to" }
        ] },
        { group: "Creating Elements", command: "create_frame", description: "Create a new frame in Figma", params: [
          { name: "x", type: "number", required: true, description: "X position" },
          { name: "y", type: "number", required: true, description: "Y position" },
          { name: "width", type: "number", required: true, description: "Width of the frame" },
          { name: "height", type: "number", required: true, description: "Height of the frame" },
          { name: "name", type: "string", required: false, default: "Frame", description: "Optional name for the frame" },
          { name: "parentId", type: "string", required: false, description: "Optional parent node ID to append the frame to" },
          { name: "fillColor", type: "object", required: false, description: "Fill color in RGBA format", fields: [
            { name: "r", type: "number", required: true, min: 0, max: 1, description: "Red (0-1)" },
            { name: "g", type: "number", required: true, min: 0, max: 1, description: "Green (0-1)" },
            { name: "b", type: "number", required: true, min: 0, max: 1, description: "Blue (0-1)" },
            { name: "a", type: "number", required: false, min: 0, max: 1, description: "Alpha (0-1)" }
          ] },
          { name: "strokeColor", type: "object", required: false, description: "Stroke color in RGBA format", fields: [
            { name: "r", type: "number", required: true, min: 0, max: 1, description: "Red (0-1)" },
            { name: "g", type: "number", required: true, min: 0, max: 1, description: "Green (0-1)" },
            { name: "b", type: "number", required: true, min: 0, max: 1, description: "Blue (0-1)" },
            { name: "a", type: "number", required: false, min: 0, max: 1, description: "Alpha (0-1)" }
          ] },
          { name: "strokeWeight", type: "number", required: false, description: "Stroke weight (positive)" },
          { name: "layoutMode", type: "enum", required: false, values: ["NONE", "HORIZONTAL", "VERTICAL"], description: "Auto-layout mode" },
          { name: "layoutWrap", type: "enum", required: false, values: ["NO_WRAP", "WRAP"], description: "Whether the auto-layout frame wraps children" },
          { name: "paddingTop", type: "number", required: false, description: "Top padding" },
          { name: "paddingRight", type: "number", required: false, description: "Right padding" },
          { name: "paddingBottom", type: "number", required: false, description: "Bottom padding" },
          { name: "paddingLeft", type: "number", required: false, description: "Left padding" },
          { name: "primaryAxisAlignItems", type: "enum", required: false, values: ["MIN", "MAX", "CENTER", "SPACE_BETWEEN"], description: "Primary axis alignment (SPACE_BETWEEN ignores itemSpacing)" },
          { name: "counterAxisAlignItems", type: "enum", required: false, values: ["MIN", "MAX", "CENTER", "BASELINE"], description: "Counter axis alignment" },
          { name: "layoutSizingHorizontal", type: "enum", required: false, values: ["FIXED", "HUG", "FILL"], description: "Horizontal sizing mode" },
          { name: "layoutSizingVertical", type: "enum", required: false, values: ["FIXED", "HUG", "FILL"], description: "Vertical sizing mode" },
          { name: "itemSpacing", type: "number", required: false, description: "Distance between children (ignored if SPACE_BETWEEN)" }
        ] },
        { group: "Creating Elements", command: "create_text", description: "Create a new text element in Figma", params: [
          { name: "x", type: "number", required: true, description: "X position" },
          { name: "y", type: "number", required: true, description: "Y position" },
          { name: "text", type: "string", required: true, description: "Text content" },
          { name: "fontSize", type: "number", required: false, default: 14, description: "Font size" },
          { name: "fontWeight", type: "number", required: false, default: 400, description: "Font weight (400 Regular, 700 Bold)" },
          { name: "fontColor", type: "object", required: false, description: "Font color in RGBA format", fields: [
            { name: "r", type: "number", required: true, min: 0, max: 1, description: "Red (0-1)" },
            { name: "g", type: "number", required: true, min: 0, max: 1, description: "Green (0-1)" },
            { name: "b", type: "number", required: true, min: 0, max: 1, description: "Blue (0-1)" },
            { name: "a", type: "number", required: false, min: 0, max: 1, description: "Alpha (0-1)" }
          ] },
          { name: "name", type: "string", required: false, default: "Text", description: "Semantic layer name" },
          { name: "parentId", type: "string", required: false, description: "Optional parent node ID" }
        ] },
        { group: "Creating Elements", command: "clone_node", description: "Clone an existing node in Figma", params: [
          { name: "nodeId", type: "string", required: true, description: "The ID of the node to clone" },
          { name: "x", type: "number", required: false, description: "New X position for the clone" },
          { name: "y", type: "number", required: false, description: "New Y position for the clone" }
        ] },

        { group: "Layout & Organization", command: "move_node", description: "Move a node to a new position", params: [
          { name: "nodeId", type: "string", required: true, description: "The ID of the node to move" },
          { name: "x", type: "number", required: true, description: "New X position" },
          { name: "y", type: "number", required: true, description: "New Y position" }
        ] },
        { group: "Layout & Organization", command: "resize_node", description: "Resize a node", params: [

      // Coerce a form value into the typed wire value (undefined = omit)
      function coerceParam(p, raw) {
        switch (p.type) {
          case "number": {
            if (raw === "" || raw === undefined || raw === null) return undefined;
            const n = Number(raw);
            return Number.isNaN(n) ? undefined : n;
          }
          case "boolean":
            return !!raw; // explicit true/false
          case "enum":
          case "string":
            return raw === "" || raw === undefined || raw === null ? undefined : raw;
          case "json": {
            if (raw === undefined || raw === null || !String(raw).trim()) return undefined;
            return JSON.parse(raw); // may throw -> caller handles
          }
          case "object": {
            const o = {};
            let any = false;
            for (const f of p.fields) {
              const v = coerceParam(f, (raw || {})[f.name]);
              if (v !== undefined) { o[f.name] = v; any = true; }
            }
            return any ? o : undefined;
          }
          default:
            return raw;
        }
      }

      // Build the wire params object from form values; throws on bad JSON
      function buildParams(spec, values) {
        const out = {};
        for (const p of spec.params) {
          let v;
          try {
            v = coerceParam(p, values[p.name]);
          } catch (e) {
            throw new Error(`${p.name}: ${e.message}`);
          }
          if (v !== undefined) out[p.name] = v;
        }
        return out;
      }

      function ExportGallery() {
        const [gallery, setGallery] = useState(null);
        const [days, setDays] = useState(30);
        const [busy, setBusy] = useState(false);
        const load = useCallback(async () => {
          try {
            const response = await fetch(relayApiUrl("exports"));
            const data = await response.json();
            setGallery(data);
            if (data.retentionDays) setDays(data.retentionDays);
          } catch {}
        }, []);
        useEffect(() => { load(); const timer = setInterval(load, 10000); return () => clearInterval(timer); }, [load]);
        const clean = async (all) => {
          if (all && !window.confirm("Delete every image in the managed export gallery? This cannot be undone.")) return;
          setBusy(true);
          try {
            const suffix = all ? "" : `?olderThanDays=${Math.max(0, Number(days) || 0)}`;
            const response = await fetch(relayApiUrl(`exports${suffix}`), { method: "DELETE" });
            const data = await response.json();
            setGallery(data.gallery || gallery);
          } finally { setBusy(false); }
        };
        const formatBytes = (bytes) => bytes >= 1024 * 1024
          ? `${(bytes / 1024 / 1024).toFixed(1)} MB`
          : `${Math.round((bytes || 0) / 1024)} KB`;
        return (
          <div className="section">
            <h2>Generated Images</h2>
            <div className="member"><code>{gallery?.files?.length || 0} files · {formatBytes(gallery?.totalBytes || 0)} · auto-delete after {gallery?.retentionDays || 30} days</code></div>
            <div className="row" style={{ marginTop: 8 }}>
              <input type="number" min="0" value={days} onChange={(e) => setDays(e.target.value)} title="Delete files older than this many days" />
              <button className="ghost" disabled={busy} onClick={() => clean(false)}>Delete older</button>
              <button className="ghost" disabled={busy || !gallery?.files?.length} onClick={() => clean(true)}>Delete all</button>
            </div>
            <div className="gallery-grid">
              {(gallery?.files || []).slice(0, 20).map((file) => {
                const fileUrl = relayApiUrl(`exports/file/${encodeURIComponent(file.name)}`);
                return (
                  <div className="gallery-item" key={file.name} title={`${file.name}\n${formatBytes(file.bytes)}\n${new Date(file.createdAt).toLocaleString()}`} onClick={() => window.open(fileUrl, "_blank")}>
                    {file.mimeType.startsWith("image/") && file.mimeType !== "image/svg+xml"
                      ? <img src={fileUrl} loading="lazy" alt={file.name} />
                      : <div style={{ height: 72, display: "grid", placeItems: "center" }}>{file.mimeType.includes("pdf") ? "PDF" : "SVG"}</div>}
                    <div className="gallery-caption">{file.name} · {formatBytes(file.bytes)}</div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // ----- Test call panel (uses its own peer WebSocket) -------------------
      // ----- Swagger-style request explorer ---------------------------------
      function Field({ p, value, onChange }) {
        const req = p.required ? <span className="req">*</span> : null;
        if (p.type === "object") {
          return (
            <div className="obj-field">
              <div className="obj-head">{p.name}{req} <span className="muted">{p.description}</span></div>
              <div className="obj-body">
                {p.fields.map((f) => (
                  <Field
                    key={f.name}
                    p={f}
                    value={(value || {})[f.name]}
                    onChange={(v) => onChange({ ...(value || {}), [f.name]: v })}
                  />
                ))}
              </div>
            </div>
          );
        }
        let input;
        if (p.type === "boolean") {
          input = <input type="checkbox" checked={!!value} onChange={(e) => onChange(e.target.checked)} />;
        } else if (p.type === "enum") {
          input = (
            <select value={value ?? ""} onChange={(e) => onChange(e.target.value)}>
              <option value="">{p.required ? "(select)" : "(none)"}</option>
              {p.values.map((v) => <option key={v} value={v}>{v}</option>)}
            </select>
          );
        } else if (p.type === "number") {
          input = <input type="number" value={value ?? ""} onChange={(e) => onChange(e.target.value)} placeholder={p.default !== undefined ? String(p.default) : ""} />;
        } else if (p.type === "json") {
          input = <textarea rows={3} value={value ?? ""} onChange={(e) => onChange(e.target.value)} placeholder={p.example || "JSON"} spellCheck={false} />;
        } else {
          input = <input value={value ?? ""} onChange={(e) => onChange(e.target.value)} placeholder={p.default !== undefined ? String(p.default) : ""} />;
        }
        return (
          <div className={"field" + (p.type === "boolean" ? " field-inline" : "")}>
            <label>{p.name}{req} <span className="ptype">{p.type}{p.values ? ` ${p.values.join("|")}` : ""}</span></label>
            {input}
            {p.description && <div className="phint">{p.description}</div>}
          </div>
        );
      }

      function RequestExplorer({ projects }) {
        const [channel, setChannel] = useState("");
        const [command, setCommand] = useState("get_document_info");
        const [values, setValues] = useState({});
        const [busy, setBusy] = useState(false);
        const [result, setResult] = useState(null);
        const wsRef = useRef(null);
        const stateRef = useRef({ channel: null, joined: false, pending: new Map() });
        const connections = useMemo(() => projects.filter((p) => p.recommendedChannel), [projects]);

        const spec = useMemo(() => COMMAND_CATALOG.find((c) => c.command === command), [command]);
        const grouped = useMemo(() => {
          const m = {};
          for (const c of COMMAND_CATALOG) (m[c.group] = m[c.group] || []).push(c);
          return m;
        }, []);

        // default project = first live project; relay already chose its least-loaded connection
        useEffect(() => {
          if (!channel && connections.length) {
            setChannel(connections[0].recommendedChannel);
          }
        }, [connections, channel]);

        // reset form to defaults when the command changes
        useEffect(() => {
          const init = {};
          if (spec) {
            for (const p of spec.params) {
              if ((p.type === "number" || p.type === "boolean" || p.type === "enum" || p.type === "string")
                  && p.default !== undefined) {
                init[p.name] = p.default;
              }
            }
          }
          setValues(init);
          setResult(null);
        }, [command]);

        const preview = useMemo(() => {
          if (!spec) return "";
          try {
            return JSON.stringify({ command, params: buildParams(spec, values) }, null, 2);
          } catch (e) {
            return "// " + e.message;
          }
        }, [spec, command, values]);

        function ensureSocket(target) {
          const st = stateRef.current;
          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN && st.channel === target && st.joined) {
            return Promise.resolve();
          }
          if (wsRef.current) { try { wsRef.current.close(); } catch {} }
          return new Promise((resolve, reject) => {
            const ws = new WebSocket(WS_URL);
            ws.binaryType = "arraybuffer";
            wsRef.current = ws;
            st.channel = target; st.joined = false; st.pending = new Map();
            const to = setTimeout(() => reject(new Error("connect/join timeout")), 8000);
            // join as a controller (so the server labels us controller, not figma)
            ws.onopen = () => {
              ws.send(JSON.stringify({ type: "hello", role: "controller", requesterId: "dashboard", protocolVersion: PROTOCOL_VERSION, deviceName: "Web console", platform: navigator.platform || navigator.userAgent, capabilities: ["binaryFrames", "livePreview"] }));
              ws.send(JSON.stringify({ type: "join", channel: target, requesterId: "dashboard", id: genId(), message: { command: "join" } }));
            };
            ws.onerror = () => { clearTimeout(to); reject(new Error("socket error")); };
            ws.onmessage = (ev) => {
              let d;
              try {
                if (typeof ev.data === "string") d = JSON.parse(ev.data);
                else {
                  const decoded = decodeBinaryFrame(ev.data);
                  d = decoded.envelope;
                  if (d.message?.result) {
                    d.message.result = { ...d.message.result, binary: true, byteLength: decoded.payload.byteLength };
                  }
                }
              } catch { return; }
              if (d.type === "system" && d.event === "protocol_mismatch") {
                clearTimeout(to); reject(new Error(d.message)); return;
              }
              if (!st.joined && d.type === "system" && d.message && d.message.result) {
                st.joined = true; clearTimeout(to); resolve(); return;
              }
              const m = d.message;
              if (m && m.id && st.pending.has(m.id)) {
                const cb = st.pending.get(m.id); st.pending.delete(m.id); cb(m);
              }
            };
          });
        }

        async function send() {
          // build + validate params
          let params;
          try {
            params = buildParams(spec, values);
          } catch (e) {
            setResult({ error: "Param error — " + e.message });
            return;
          }
          const missing = spec.params.filter((p) => p.required && params[p.name] === undefined).map((p) => p.name);
          if (missing.length) {
            setResult({ error: "Missing required: " + missing.join(", ") });
            return;
          }
          setBusy(true); setResult(null);
          try {
            await ensureSocket(channel);
            const id = genId();
            const st = stateRef.current;
            const startedAt = performance.now();
            const done = new Promise((resolve) => {
              const timer = setTimeout(() => { st.pending.delete(id); resolve({ error: "Timed out after 30s" }); }, 30000);
              st.pending.set(id, (m) => { clearTimeout(timer); resolve(m); });
            });
            wsRef.current.send(JSON.stringify({
              id, type: "message", channel,
              message: { id, command, params: { ...params, commandId: id } },
            }));
            const m = await done;
            const ms = Math.round(performance.now() - startedAt);
            setResult(m.error ? { error: m.error, ms } : { result: m.result, ms });
          } catch (e) {
            setResult({ error: e.message });
          } finally {
            setBusy(false);
          }
        }

        return (
          <div className="explorer">
            <div className="exp-top">
              <div className="exp-field">
                <label>Figma Project</label>
                <select value={channel} onChange={(e) => setChannel(e.target.value)}>
                  {connections.length === 0 && <option value="">(no projects)</option>}
                  {connections.map((project) => (
                    <option key={project.projectKey} value={project.recommendedChannel}>
                      {project.name} ({project.connectionCount} connections · busy {project.busy || 0})
                    </option>
                  ))}
                </select>
              </div>
              <div className="exp-field">
                <label>Command</label>
                <select value={command} onChange={(e) => setCommand(e.target.value)}>
                  {Object.entries(grouped).map(([g, cmds]) => (
                    <optgroup key={g} label={g}>
                      {cmds.map((c) => <option key={c.command} value={c.command}>{c.command}</option>)}
                    </optgroup>
                  ))}
                </select>
              </div>
            </div>
            <div className="exp-desc">{spec?.description}</div>

            <div className="exp-body">
              <div className="exp-form">
                <h4>Parameters</h4>
                {spec && spec.params.length === 0 && <div className="muted">No parameters.</div>}
                {spec && spec.params.map((p) => (
                  <Field key={p.name} p={p} value={values[p.name]} onChange={(v) => setValues((s) => ({ ...s, [p.name]: v }))} />
                ))}
              </div>
              <div className="exp-side">
                <h4>Request</h4>
                <pre className="exp-preview">{preview}</pre>
                <button onClick={send} disabled={busy || !channel}>{busy ? "Sending…" : "Send"}</button>
                {result && (
                  <div className="result-box">
                    <div className={result.error ? "bad" : "ok"}>
                      {result.error ? "✗ error" : "✓ response"}{result.ms != null ? ` · ${result.ms}ms` : ""}
                    </div>
                    <pre>{JSON.stringify(result.error ?? result.result, null, 2)}</pre>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ----- Virtualized log list -------------------------------------------
      const KINDS = ["command", "started", "result", "bulk", "timeout", "unstable", "heartbeat_timeout", "join", "connect", "disconnect", "progress", "document", "channel_closed"];

      function LogPanel({ getEvents, version, filter, setFilter }) {
        const [enabled, setEnabled] = useState(() => new Set(KINDS));
        const [autoscroll, setAutoscroll] = useState(true);
        const [selected, setSelected] = useState(null);
        const hostRef = useRef(null);
        const listRef = useRef(null);
        const { h } = useSize(hostRef);

        const filtered = useMemo(() => {
          const all = getEvents();
          const f = filter.trim().toLowerCase();
          return all.filter((e) => {
            if (!enabled.has(e.kind)) return false;
            if (!f) return true;
            return (e.command || "").toLowerCase().includes(f)
              || (e.channel || "").toLowerCase().includes(f)
              || (e.commandId || "").toLowerCase().includes(f)
              || (e.requesterId || "").toLowerCase().includes(f)
              || (e.batchId || e.id || "").toLowerCase().includes(f)
              || summarize(e).toLowerCase().includes(f);
          });
        // eslint-disable-next-line
        }, [version, filter, enabled]);

        useEffect(() => {
          if (autoscroll && listRef.current && filtered.length) {
            listRef.current.scrollToItem(filtered.length - 1, "end");
          }
        }, [filtered.length, autoscroll]);

        const toggleKind = (k) => setEnabled((prev) => {
          const n = new Set(prev); n.has(k) ? n.delete(k) : n.add(k); return n;
        });

        const Row = useCallback(({ index, style }) => {
          const e = filtered[index];
          const errCls = e.kind === "result" && !e.ok ? " err" : "";
          return (
            <div
              className={"logrow" + (selected && selected._i === e._i ? " sel" : "")}
              style={style}
              onClick={() => setSelected(e)}
            >
              <span className="ts">{fmtTime(e.ts)}</span>
              <span className={"kind " + e.kind + errCls}>{e.kind}</span>
              <span className="chan-col">{e.channel ? "#" + e.channel : ""}</span>
              <span className="summary">{summarize(e)}</span>
            </div>
          );
        }, [filtered, selected]);

        return (
          <>
            <div className="toolbar">
              <input type="text" placeholder="filter… channel / requester / command / bulk id" value={filter} onChange={(e) => setFilter(e.target.value)} />
              {filter && <button className="ghost" style={{ padding: "4px 8px" }} onClick={() => setFilter("")}>clear</button>}
              {KINDS.map((k) => (
                <label className="chk" key={k}>
                  <input type="checkbox" checked={enabled.has(k)} onChange={() => toggleKind(k)} /> {k}
                </label>
              ))}
              <label className="chk">
                <input type="checkbox" checked={autoscroll} onChange={(e) => setAutoscroll(e.target.checked)} /> autoscroll
              </label>
              <span className="muted" style={{ marginLeft: "auto" }}>{filtered.length} shown</span>
            </div>
            <div className="list-host" ref={hostRef}>
              {h > 0 && (
                <FixedSizeList
                  height={h}
                  width="100%"
                  itemCount={filtered.length}
                  itemSize={ROW_H}
                  ref={listRef}
                >
                  {Row}
                </FixedSizeList>
              )}
            </div>
            {selected && (
              <div className="detail">
                <pre>{JSON.stringify(selected, null, 2)}</pre>
              </div>
            )}
          </>
        );
      }

      // ----- Root app --------------------------------------------------------
      function App() {
        const [connected, setConnected] = useState(false);
        const [channels, setChannels] = useState([]);
        const [projects, setProjects] = useState([]);
        const [bulkJobs, setBulkJobs] = useState([]);
        const bufRef = useRef([]);       // ring buffer of events
        const queueRef = useRef([]);     // pending events between flushes
        const pausedRef = useRef(false);
        const [paused, setPaused] = useState(false);
        const [version, setVersion] = useState(0); // bumped on flush to trigger renders
        const [filter, setFilter] = useState("");  // shared: channel click sets this
        const [view, setView] = useState("logs");   // main area: logs | explorer
        const [selectedProject, setSelectedProject] = useState(null);
        const [preview, setPreview] = useState(null);
        const [captureMode, setCaptureMode] = useState(() =>
          localStorage.getItem("talk-to-figma-preview-mode") === "node-export" ? "node-export" : "app-window"
        );
        const seqRef = useRef(0);
        const monitorRef = useRef(null); // live monitor socket, for sending actions
        const desiredPreviewChannelRef = useRef(null);
        const captureModeRef = useRef("app-window");

        pausedRef.current = paused;

        const getEvents = useCallback(() => bufRef.current, []);

        useEffect(() => {
          let ws, alive = true, retry;
          const connect = () => {
            ws = new WebSocket(WS_URL);
            ws.binaryType = "arraybuffer";
            monitorRef.current = ws;
            ws.onopen = () => {
              setConnected(true);
              ws.send(JSON.stringify({ type: "hello", role: "controller", requesterId: "dashboard-monitor", protocolVersion: PROTOCOL_VERSION, deviceName: "Web console monitor", platform: navigator.platform || navigator.userAgent, capabilities: ["binaryFrames", "livePreview"] }));
              ws.send(JSON.stringify({ type: "monitor" }));
              if (desiredPreviewChannelRef.current) {
                ws.send(JSON.stringify({ type: "preview_subscribe", channel: desiredPreviewChannelRef.current, mode: captureModeRef.current }));
              }
            };
            ws.onclose = () => { setConnected(false); if (alive) retry = setTimeout(connect, 1500); };
            ws.onerror = () => { try { ws.close(); } catch {} };
            ws.onmessage = (ev) => {
              let msg;
              let previewPayload;
              try {
                if (typeof ev.data === "string") {
                  msg = JSON.parse(ev.data);
                } else {
                  const decoded = decodeBinaryFrame(ev.data);
                  msg = decoded.envelope;
                  previewPayload = decoded.payload;
                }
              } catch { return; }
              if (msg.kind === "preview_frame") {
                const bytes = previewPayload || (msg.preview?.imageData
                  ? Uint8Array.from(atob(msg.preview.imageData), (c) => c.charCodeAt(0))
                  : null);
                if (bytes) {
                  const url = URL.createObjectURL(new Blob([bytes], { type: msg.preview?.mimeType || "image/png" }));
                  setPreview((previous) => {
                    if (previous?.url) URL.revokeObjectURL(previous.url);
                    return { url, meta: msg.preview };
                  });
                }
                return;
              }
              if (msg.kind === "preview_error") {
                setPreview((previous) => {
                  if (previous?.url) URL.revokeObjectURL(previous.url);
                  return { error: msg.error || "Preview failed" };
                });
                return;
              }
              if (msg.kind === "snapshot") {
                setChannels(msg.channels || []);
                setProjects(msg.projects || []);
                setBulkJobs(msg.bulkJobs || []);
                (msg.log || []).forEach((e) => { e._i = ++seqRef.current; });
                bufRef.current = (msg.log || []).slice(-RING);
                setVersion((v) => v + 1);
              } else if (msg.kind === "channels") {
                setChannels(msg.channels || []);
                setProjects(msg.projects || []);
                setBulkJobs(msg.bulkJobs || []);
              } else if (msg.kind === "event") {
                if (!pausedRef.current) queueRef.current.push(msg.event);
              }
            };
          };
          connect();

          const flush = setInterval(() => {
            if (!queueRef.current.length) return;
            const incoming = queueRef.current;
            queueRef.current = [];
            for (const e of incoming) { e._i = ++seqRef.current; bufRef.current.push(e); }
            if (bufRef.current.length > RING) bufRef.current.splice(0, bufRef.current.length - RING);
            setVersion((v) => v + 1);
          }, FLUSH_MS);

          return () => { alive = false; clearTimeout(retry); clearInterval(flush); try { ws.close(); } catch {} };
        }, []);

        desiredPreviewChannelRef.current = selectedProject && view === "logs"
          ? selectedProject.recommendedChannel
          : null;
        captureModeRef.current = captureMode;

        useEffect(() => {
          localStorage.setItem("talk-to-figma-preview-mode", captureMode);
        }, [captureMode]);

        useEffect(() => {
          const channel = desiredPreviewChannelRef.current;
          const ws = monitorRef.current;
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "preview_subscribe", channel, mode: captureMode }));
          }
          setPreview((previous) => {
            if (previous?.url) URL.revokeObjectURL(previous.url);
            return null;
          });
        }, [selectedProject?.recommendedChannel, view, captureMode]);

        const clear = () => { bufRef.current = []; queueRef.current = []; setVersion((v) => v + 1); };
        const clearEmpty = useCallback(() => {
          const ws = monitorRef.current;
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "clear_empty" }));
        }, []);

        return (
          <>
            <div className="topbar">
              <span className={"dot " + (connected ? "on" : "off")}></span>
              <h1>Talk-to-Figma · Server Console</h1>
              <span className="muted">{WS_URL}</span>
              <span className="view-tabs">
                <button className={"vtab" + (view === "logs" ? " active" : "")} onClick={() => setView("logs")}>Logs</button>
                <button className={"vtab" + (view === "explorer" ? " active" : "")} onClick={() => setView("explorer")}>Request Explorer</button>
              </span>
              <span style={{ marginLeft: "auto" }} className="row">
                {view === "logs" && <button className="ghost" onClick={() => setPaused((p) => !p)}>{paused ? "Resume" : "Pause"}</button>}
                {view === "logs" && <button className="ghost" onClick={clear}>Clear log</button>}
              </span>
            </div>
            <div className="main">
              <div className="sidebar">
                <Projects
                  projects={projects}
                  bulkJobs={bulkJobs}
                  onProjectPick={(project) => { setSelectedProject(project); setFilter(project.name || project.projectKey); setView("logs"); }}
                  onFilterPick={(value) => { setSelectedProject(null); setFilter(value); setView("logs"); }}
                />
                <ExportGallery />
                <Channels channels={channels} onPick={(ch) => { setSelectedProject(null); setFilter(ch); setView("logs"); }} onClearEmpty={clearEmpty} />
              </div>
              <div className="logwrap">
                {view === "logs" && <PreviewPanel project={selectedProject} preview={preview} captureMode={captureMode} onModeChange={setCaptureMode} onClose={() => setSelectedProject(null)} />}
                {view === "logs"
                  ? <LogPanel getEvents={getEvents} version={version} filter={filter} setFilter={setFilter} />
                  : <RequestExplorer projects={projects} />}
              </div>
            </div>
          </>
        );
      }

      createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
